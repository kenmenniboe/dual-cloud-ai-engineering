<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img"><title>RPO and RTO timeline</title><style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th,.c-coral>.t{fill:#712B13}.c-coral>.ts{fill:#993C1D}.c-pink>rect,rect.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>.th,.c-pink>.t{fill:#72243E}.c-pink>.ts{fill:#993556}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th,.c-gray>.t{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-blue>rect,rect.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>.th,.c-blue>.t{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-green>rect,rect.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>.th,.c-green>.t{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-amber>rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.th,.c-amber>.t{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-red>rect,rect.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.th,.c-red>.t{fill:#791F1F}.c-red>.ts{fill:#A32D2D}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/><rect x="160" y="40" width="180" height="76" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="250.0" y="58" text-anchor="middle" dominant-baseline="central">RPO</text><text class="ts" x="250" y="94" text-anchor="middle">How much data you lose</text><rect x="340" y="40" width="200" height="76" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/><text class="th" x="440.0" y="58" text-anchor="middle" dominant-baseline="central">RTO</text><text class="ts" x="440" y="94" text-anchor="middle">How long you are down</text><line x1="60" y1="150" x2="620" y2="150" class="arr" marker-end="url(#arrow)"/><text class="ts" x="620" y="138" text-anchor="end">time</text><line x1="160" y1="140" x2="160" y2="160" stroke="#5F5E5A" stroke-width="1.5"/><line x1="340" y1="140" x2="340" y2="160" stroke="#5F5E5A" stroke-width="1.5"/><line x1="540" y1="140" x2="540" y2="160" stroke="#5F5E5A" stroke-width="1.5"/><g class="c-green"><rect x="100" y="180" width="120" height="52" rx="4" stroke-width="0.5"/><text class="th" x="160.0" y="197.0" text-anchor="middle" dominant-baseline="central">Last backup</text><text class="ts" x="160.0" y="216.0" text-anchor="middle" dominant-baseline="central">Recovery point</text></g><g class="c-red"><rect x="280" y="180" width="120" height="52" rx="4" stroke-width="0.5"/><text class="th" x="340.0" y="197.0" text-anchor="middle" dominant-baseline="central">Disaster</text><text class="ts" x="340.0" y="216.0" text-anchor="middle" dominant-baseline="central">Outage begins</text></g><g class="c-teal"><rect x="480" y="180" width="120" height="52" rx="4" stroke-width="0.5"/><text class="th" x="540.0" y="197.0" text-anchor="middle" dominant-baseline="central">App restored</text><text class="ts" x="540.0" y="216.0" text-anchor="middle" dominant-baseline="central">Recovery time</text></g><text class="ts" x="340" y="268" text-anchor="middle">Shrinking either window costs more money</text></svg>