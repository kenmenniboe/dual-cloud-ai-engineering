<text x="752" y="99" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">429</text>
<text x="782" y="86.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">Sync: 429</text>
<text x="782" y="101.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">immediately</text>
<rect x="732" y="132" width="40" height="40" rx="6" fill="#E7157B"/>
<text x="752" y="157" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">DLQ</text>
<text x="782" y="144.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">Async: retry up</text>
<text x="782" y="159.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">to 6 h, then DLQ</text>
<line x1="234" y1="130.0" x2="364" y2="130.0" stroke="#232F3E" stroke-width="1.6" marker-end="url(#a)"/>
<text x="299.0" y="120.0" font-size="11.5" text-anchor="middle" fill="#232F3E">invoke</text>
<line x1="584" y1="130.0" x2="714" y2="130.0" stroke="#232F3E" stroke-width="1.6" marker-end="url(#a)"/>
