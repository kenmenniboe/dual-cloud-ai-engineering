<text x="125.0" y="52" font-size="13" font-weight="bold" text-anchor="middle" fill="#232F3E">Callers</text>
<rect x="32" y="74" width="40" height="40" rx="6" fill="#E7157B"/>
<text x="52" y="99" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">SYNC</text>
<text x="82" y="86.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">Sync: API GW,</text>
<text x="82" y="101.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">ALB, SDK</text>
<rect x="32" y="132" width="40" height="40" rx="6" fill="#E7157B"/>
<text x="52" y="157" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">ASYNC</text>
<text x="82" y="144.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">Async: S3,</text>
<text x="82" y="159.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">SNS, EventBridge</text>
<rect x="370" y="60" width="210" height="140" rx="8" fill="none" stroke="#7D8998" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="475.0" y="52" font-size="13" font-weight="bold" text-anchor="middle" fill="#232F3E">Lambda pool</text>
<rect x="382" y="74" width="40" height="40" rx="6" fill="#ED7100"/>
<text x="402" y="99" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">λ</text>
<text x="432" y="86.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">Account pool</text>
<text x="432" y="101.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">1000 per Region</text>
<rect x="382" y="132" width="40" height="40" rx="6" fill="#ED7100"/>
<text x="402" y="157" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">RSV</text>
<text x="432" y="144.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">Reserved</text>
<text x="432" y="159.5" font-size="12.5" fill="#232F3E" dominant-baseline="middle">concurrency</text>
<rect x="720" y="60" width="210" height="140" rx="8" fill="none" stroke="#7D8998" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="825.0" y="52" font-size="13" font-weight="bold" text-anchor="middle" fill="#232F3E">When throttled</text>
