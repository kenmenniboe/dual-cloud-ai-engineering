<svg xmlns="http://www.w3.org/2000/svg" width="950" height="246" viewBox="0 0 950 246" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#232F3E"/></marker></defs>
<rect width="950" height="246" fill="#FFFFFF"/>
<text x="20" y="30" font-size="18" font-weight="bold" fill="#232F3E">Module 4A: Throttling - sync vs async</text>
