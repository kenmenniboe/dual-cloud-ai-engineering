<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" font-family="Helvetica, Arial, sans-serif">
  <title>Menniboe Farm decoupling lab: SQS, SNS fan-out, Kinesis Data Streams to Firehose to S3</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#545B64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="860" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="56" fill="#232F3E"/>
  <text x="28" y="35" font-size="20" font-weight="700" fill="#FFFFFF">Menniboe Farm: decoupling with SQS, SNS, Kinesis, Firehose</text>
  <text x="972" y="35" text-anchor="end" font-size="13" fill="#FF9900">AWS SAA lab · us-east-1</text>

  <!-- ===== LANE 1: QUEUES ===== -->
  <text x="28" y="88" font-size="13" font-weight="700" fill="#879196">PARTS 1-2 · QUEUE MODEL (PULL, DELETE WHEN DONE)</text>
  <!-- Producers -->
  <rect x="28" y="100" width="180" height="150" rx="4" fill="none" stroke="#879196" stroke-dasharray="6 4"/>
  <text x="118" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#232F3E">Producers</text>
  <rect x="94" y="116" width="48" height="48" rx="6" fill="#232F3E"/>
  <text x="118" y="146" text-anchor="middle" font-size="17" font-family="monospace" fill="#FFFFFF">&gt;_</text>
  <text x="118" y="184" text-anchor="middle" font-size="12" fill="#232F3E">Console / web app</text>
  <text x="118" y="200" text-anchor="middle" font-size="11" fill="#545B64">"Order 1001: 2 goats"</text>
  <!-- arrow -->
  <line x1="210" y1="140" x2="296" y2="140" stroke="#545B64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="216" y="114" width="74" height="18" rx="3" fill="#232F3E"/>
  <text x="253" y="127" text-anchor="middle" font-size="11" fill="#FFFFFF">SendMessage</text>
  <!-- Standard queue -->
  <rect x="300" y="112" width="56" height="56" rx="8" fill="#E7157B"/>
  <rect x="311" y="125" width="34" height="7" rx="1" fill="#FFFFFF"/><rect x="311" y="136" width="34" height="7" rx="1" fill="#FFFFFF"/><rect x="311" y="147" width="34" height="7" rx="1" fill="#FFFFFF"/>
  <text x="370" y="128" font-size="13" font-weight="700" fill="#232F3E">menniboe-farm-orders</text>
  <text x="370" y="145" font-size="11" fill="#545B64">Standard · at-least-once · best-effort order</text>
  <text x="370" y="160" font-size="11" fill="#545B64">Visibility 30 s · retention 4 d · wait 20 s</text>
  <!-- FIFO queue -->
  <rect x="300" y="182" width="56" height="56" rx="8" fill="#E7157B"/>
  <rect x="311" y="195" width="34" height="7" rx="1" fill="#FFFFFF"/><rect x="311" y="206" width="34" height="7" rx="1" fill="#FFFFFF"/><rect x="311" y="217" width="34" height="7" rx="1" fill="#FFFFFF"/>
  <text x="370" y="198" font-size="13" font-weight="700" fill="#232F3E">menniboe-farm-orders.fifo</text>
  <text x="370" y="215" font-size="11" fill="#545B64">Group ID = lane (customer-ama) · strict order</text>
  <text x="370" y="230" font-size="11" fill="#545B64">Dedup ID drops repeats within 5 min</text>
  <path d="M296 140 L280 140 L280 210 L296 210" fill="none" stroke="#545B64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Consumer -->
  <rect x="772" y="100" width="200" height="150" rx="4" fill="none" stroke="#879196" stroke-dasharray="6 4"/>
  <text x="872" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#232F3E">Consumers</text>
  <rect x="848" y="116" width="48" height="48" rx="6" fill="#232F3E"/>
  <text x="872" y="146" text-anchor="middle" font-size="17" font-family="monospace" fill="#FFFFFF">&gt;_</text>
  <text x="872" y="184" text-anchor="middle" font-size="12" fill="#232F3E">Console poller / worker</text>
  <text x="872" y="200" text-anchor="middle" font-size="11" fill="#545B64">Receive → process → Delete</text>
  <line x1="768" y1="175" x2="664" y2="175" stroke="#545B64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="680" y="148" width="74" height="18" rx="3" fill="#232F3E"/>
  <text x="717" y="161" text-anchor="middle" font-size="11" fill="#FFFFFF">Poll (pull)</text>

  <!-- ===== LANE 2: SNS FAN-OUT ===== -->
  <line x1="28" y1="272" x2="972" y2="272" stroke="#D5DBDB"/>
  <text x="28" y="300" font-size="13" font-weight="700" fill="#879196">PARTS 3-4 · PUB/SUB FAN-OUT (PUSH A COPY TO EVERY SUBSCRIBER)</text>
  <rect x="28" y="312" width="180" height="200" rx="4" fill="none" stroke="#879196" stroke-dasharray="6 4"/>
  <text x="118" y="498" text-anchor="middle" font-size="13" font-weight="700" fill="#232F3E">Producers</text>
  <rect x="94" y="346" width="48" height="48" rx="6" fill="#232F3E"/>
  <text x="118" y="376" text-anchor="middle" font-size="17" font-family="monospace" fill="#FFFFFF">&gt;_</text>
  <text x="118" y="414" text-anchor="middle" font-size="12" fill="#232F3E">Publish message</text>
  <text x="118" y="430" text-anchor="middle" font-size="11" fill="#545B64">+ attribute</text>
  <text x="118" y="446" text-anchor="middle" font-size="11" fill="#545B64">category = livestock</text>
  <line x1="210" y1="400" x2="306" y2="400" stroke="#545B64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="222" y="374" width="72" height="18" rx="3" fill="#232F3E"/>
  <text x="258" y="387" text-anchor="middle" font-size="11" fill="#FFFFFF">Publish once</text>
  <!-- SNS -->
  <rect x="310" y="368" width="64" height="64" rx="8" fill="#E7157B"/>
  <circle cx="342" cy="400" r="6" fill="#FFFFFF"/>
  <line x1="342" y1="400" x2="361" y2="383" stroke="#FFFFFF" stroke-width="2.4"/><line x1="342" y1="400" x2="364" y2="400" stroke="#FFFFFF" stroke-width="2.4"/><line x1="342" y1="400" x2="361" y2="417" stroke="#FFFFFF" stroke-width="2.4"/><line x1="342" y1="400" x2="322" y2="400" stroke="#FFFFFF" stroke-width="2.4"/>
  <text x="342" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#232F3E">Amazon SNS</text>
  <text x="342" y="466" text-anchor="middle" font-size="11" fill="#545B64">menniboe-farm-orders-topic</text>
  <text x="342" y="481" text-anchor="middle" font-size="11" fill="#545B64">Standard · not persisted</text>
  <!-- fan-out arrows -->
  <path d="M376 400 L430 400 L430 340 L506 340" fill="none" stroke="#545B64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M430 400 L506 400" fill="none" stroke="#545B64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M430 400 L430 460 L506 460" fill="none" stroke="#545B64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Subscribers -->
  <rect x="490" y="312" width="482" height="200" rx="4" fill="none" stroke="#879196" stroke-dasharray="6 4"/>
  <text x="958" y="498" text-anchor="end" font-size="13" font-weight="700" fill="#232F3E">Subscribers</text>
  <rect x="510" y="320" width="40" height="40" rx="5" fill="#E7157B"/>
  <rect x="520" y="331" width="20" height="15" rx="1" fill="none" stroke="#FFFFFF" stroke-width="2"/><path d="M520 331 L530 339 L540 331" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="562" y="336" font-size="13" font-weight="700" fill="#232F3E">Email subscription</text>
  <text x="562" y="352" font-size="11" fill="#545B64">No filter → receives every order · confirm link required</text>
  <rect x="510" y="380" width="40" height="40" rx="5" fill="#E7157B"/>
  <rect x="518" y="390" width="24" height="6" rx="1" fill="#FFFFFF"/><rect x="518" y="398" width="24" height="6" rx="1" fill="#FFFFFF"/><rect x="518" y="406" width="24" height="6" rx="1" fill="#FFFFFF"/>
  <text x="562" y="396" font-size="13" font-weight="700" fill="#232F3E">menniboe-livestock-orders (SQS)</text>
  <text x="562" y="412" font-size="11" fill="#545B64">Filter {"category": ["livestock"]}</text>
  <rect x="510" y="440" width="40" height="40" rx="5" fill="#E7157B"/>
  <rect x="518" y="450" width="24" height="6" rx="1" fill="#FFFFFF"/><rect x="518" y="458" width="24" height="6" rx="1" fill="#FFFFFF"/><rect x="518" y="466" width="24" height="6" rx="1" fill="#FFFFFF"/>
  <text x="562" y="456" font-size="13" font-weight="700" fill="#232F3E">menniboe-produce-orders (SQS)</text>
  <text x="562" y="472" font-size="11" fill="#545B64">Filter {"category": ["produce"]}</text>
  <!-- policy callout -->
  <rect x="610" y="520" width="362" height="40" rx="4" fill="#FFF4E5" stroke="#FF9900"/>
  <text x="622" y="537" font-size="11" font-weight="700" fill="#8A4B00">Queue access policy must allow SNS:</text>
  <text x="622" y="552" font-size="11" fill="#8A4B00">SQS:SendMessage, Condition aws:SourceArn = topic ARN</text>

  <!-- ===== LANE 3: STREAMING ===== -->
  <line x1="28" y1="578" x2="972" y2="578" stroke="#D5DBDB"/>
  <text x="28" y="606" font-size="13" font-weight="700" fill="#879196">PARTS 5-6 · STREAMING TO A DATA LAKE (RECORDS KEPT, REPLAYABLE)</text>
  <rect x="28" y="618" width="160" height="150" rx="4" fill="none" stroke="#879196" stroke-dasharray="6 4"/>
  <text x="108" y="754" text-anchor="middle" font-size="13" font-weight="700" fill="#232F3E">Producers</text>
  <rect x="84" y="634" width="48" height="48" rx="6" fill="#232F3E"/>
  <text x="108" y="664" text-anchor="middle" font-size="17" font-family="monospace" fill="#FFFFFF">&gt;_</text>
  <text x="108" y="702" text-anchor="middle" font-size="12" fill="#232F3E">CloudShell</text>
  <text x="108" y="718" text-anchor="middle" font-size="11" fill="#545B64">put-record + partition key</text>
  <line x1="190" y1="658" x2="256" y2="658" stroke="#545B64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="198" y="632" width="52" height="18" rx="3" fill="#232F3E"/>
  <text x="224" y="645" text-anchor="middle" font-size="11" fill="#FFFFFF">Records</text>
  <!-- KDS -->
  <rect x="260" y="626" width="64" height="64" rx="8" fill="#8C4FFF"/>
  <path d="M270 645 Q281 638 292 645 T314 645" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><path d="M270 658 Q281 651 292 658 T314 658" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><path d="M270 671 Q281 664 292 671 T314 671" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
  <text x="292" y="708" text-anchor="middle" font-size="13" font-weight="700" fill="#232F3E">Kinesis Data Streams</text>
  <text x="292" y="724" text-anchor="middle" font-size="11" fill="#545B64">menniboe-farm-stream</text>
  <text x="292" y="739" text-anchor="middle" font-size="11" fill="#545B64">1 shard: 1 MiB/s in, 2 MiB/s out</text>
  <!-- consumer: CLI reader -->
  <line x1="326" y1="658" x2="456" y2="658" stroke="#545B64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="338" y="632" width="108" height="18" rx="3" fill="#232F3E"/>
  <text x="392" y="645" text-anchor="middle" font-size="11" fill="#FFFFFF">Read from LATEST</text>
  <!-- Firehose -->
  <rect x="460" y="626" width="64" height="64" rx="8" fill="#8C4FFF"/>
  <path d="M472 642 L512 642 L499 659 L499 676 L485 676 L485 659 Z" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="492" y="708" text-anchor="middle" font-size="13" font-weight="700" fill="#232F3E">Data Firehose</text>
  <text x="492" y="724" text-anchor="middle" font-size="11" fill="#545B64">menniboe-farm-firehose</text>
  <text x="492" y="739" text-anchor="middle" font-size="11" fill="#545B64">Buffer 1 MiB / 60 s · near real-time</text>
  <!-- IAM role -->
  <rect x="440" y="752" width="104" height="22" rx="3" fill="#FFF4E5" stroke="#DD344C"/>
  <text x="492" y="767" text-anchor="middle" font-size="11" fill="#8A1C2B">IAM role (assume)</text>
  <line x1="526" y1="658" x2="626" y2="658" stroke="#545B64" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="540" y="632" width="74" height="18" rx="3" fill="#232F3E"/>
  <text x="577" y="645" text-anchor="middle" font-size="11" fill="#FFFFFF">Batch write</text>
  <!-- Destination -->
  <rect x="612" y="618" width="360" height="150" rx="4" fill="none" stroke="#879196" stroke-dasharray="6 4"/>
  <text x="958" y="754" text-anchor="end" font-size="13" font-weight="700" fill="#232F3E">Destinations</text>
  <rect x="630" y="626" width="64" height="64" rx="8" fill="#7AA116"/>
  <path d="M645 644 L679 644 L674 677 L650 677 Z" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="662" cy="644" rx="17" ry="4" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
  <text x="708" y="648" font-size="13" font-weight="700" fill="#232F3E">Amazon S3 data lake</text>
  <text x="708" y="665" font-size="11" fill="#545B64">menniboe-farm-datalake-km</text>
  <text x="708" y="680" font-size="11" fill="#545B64">2026/10/01/08/ (UTC prefix)</text>
  <text x="708" y="702" font-size="11" fill="#545B64">File: 3 orders, 64 bytes, newline-delimited</text>

  <!-- Footer: key numbers -->
  <rect x="28" y="790" width="944" height="52" rx="4" fill="#F2F3F3"/>
  <text x="44" y="811" font-size="12" font-weight="700" fill="#232F3E">Key numbers</text>
  <text x="44" y="830" font-size="11" fill="#545B64">SQS retention 4 d default / 14 d max · visibility 30 s (0 s-12 h) · long poll 1-20 s · FIFO 300 msg/s (3,000 batched), dedup 5 min</text>
  <text x="640" y="811" font-size="11" fill="#545B64">KDS retention 1-365 d · Firehose buffer 0-900 s</text>
</svg>
