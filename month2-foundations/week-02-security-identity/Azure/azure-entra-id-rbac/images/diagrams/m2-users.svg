<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Entra ID user types and lifecycle</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="380" fill="#ffffff"/><rect x="30" y="30" width="620" height="110" rx="8" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 4"/><text x="46" y="50" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">How users get in</text><rect x="50" y="66" width="170" height="56" rx="5" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="135.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">Cloud-only member</text><text x="135.0" y="104.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">Created in Entra ID</text><rect x="255" y="66" width="170" height="56" rx="5" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="340.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">Synced member</text><text x="340.0" y="104.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">Edited on-prem AD</text><rect x="460" y="66" width="170" height="56" rx="5" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="545.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">Guest user</text><text x="545.0" y="104.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">Invited, B2B</text><rect x="230" y="180" width="220" height="50" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="340.0" y="205.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Tenant directory</text><line x1="135" y1="123" x2="280" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="340" y1="123" x2="340" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="545" y1="123" x2="400" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="252" width="620" height="110" rx="8" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 4"/><text x="46" y="272" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Lifecycle</text><rect x="50" y="288" width="150" height="56" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="125.0" y="307.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Restore</text><text x="125.0" y="326.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Back with properties</text><rect x="250" y="288" width="180" height="56" rx="5" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="340.0" y="307.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">Deleted users</text><text x="340.0" y="326.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Restorable 30 days</text><rect x="480" y="288" width="150" height="56" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="555.0" y="307.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Permanent delete</text><text x="555.0" y="326.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">After day 30</text><line x1="340" y1="231" x2="340" y2="286" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="352" y="260" text-anchor="start" dominant-baseline="central" font-size="12" font-style="italic" fill="#444441">delete</text><line x1="249" y1="316" x2="202" y2="316" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="431" y1="316" x2="478" y2="316" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/></svg>