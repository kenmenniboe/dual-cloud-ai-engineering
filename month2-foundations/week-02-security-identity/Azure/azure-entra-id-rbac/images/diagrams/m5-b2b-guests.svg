<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>B2B guest invitation flow</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="360" fill="#ffffff"/><rect x="25" y="30" width="340" height="150" rx="8" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 4"/><text x="195.0" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Your admin controls</text><rect x="40" y="90" width="140" height="56" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="110.0" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Collab settings</text><text x="110.0" y="128.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Who can invite</text><rect x="205" y="90" width="145" height="56" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="277.5" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Invitation</text><text x="277.5" y="128.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Email or link</text><rect x="380" y="30" width="275" height="150" rx="8" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 4"/><text x="517.5" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Your tenant</text><rect x="390" y="90" width="125" height="56" rx="5" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/><text x="452.5" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#791F1F">Guest user</text><text x="452.5" y="128.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">userType Guest</text><rect x="530" y="90" width="115" height="56" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="587.5" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Access</text><text x="587.5" y="128.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Groups, RBAC</text><line x1="181" y1="118" x2="203" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="351" y1="118" x2="388" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="516" y1="118" x2="528" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="370" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" font-style="italic" fill="#444441">creates</text><rect x="330" y="220" width="250" height="110" rx="8" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="6 4"/><text x="564" y="240" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Guest's home identity</text><rect x="350" y="258" width="210" height="56" rx="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="455.0" y="277.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Own credentials</text><text x="455.0" y="296.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Entra, MSA, Google, OTP</text><line x1="380" y1="256" x2="410" y2="148" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><text x="414" y="196" text-anchor="start" dominant-baseline="central" font-size="12" font-style="italic" fill="#444441">signs in</text></svg>