<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker></defs><rect width="900" height="380" fill="#ffffff"/><text x="20" y="30" font-size="18" font-weight="700" fill="#232F3E">Module 2 — KMS envelope encryption and audit</text><rect x="20" y="50" width="300" height="280" rx="8" fill="none" stroke="#5A6B86" stroke-width="1.6" stroke-dasharray="7 5"/><text x="30" y="68" font-size="12.5" font-weight="700" fill="#5A6B86">Your app or AWS service</text><rect x="63.0" y="98.0" width="54" height="54" rx="7" fill="#ED7100"/><text x="90" y="130" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">APP</text><text x="90" y="167.0" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">App / S3</text><text x="90" y="181.0" font-size="10.5" fill="#5A6B86" text-anchor="middle">file > 4 KB</text><rect x="63.0" y="223.0" width="54" height="54" rx="7" fill="#7AA116"/><text x="90" y="255" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">FILE</text><text x="90" y="292.0" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Encrypted file</text><text x="90" y="306.0" font-size="10.5" fill="#5A6B86" text-anchor="middle">+ encrypted data key</text><line x1="90" y1="185" x2="90" y2="220" stroke="#232F3E" stroke-width="1.8" marker-end="url(#ah)"/><rect x="119.5" y="196" width="101.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/><text x="170" y="207" font-size="11" fill="#232F3E" text-anchor="middle">encrypt locally</text><rect x="360" y="50" width="300" height="280" rx="8" fill="none" stroke="#5A6B86" stroke-width="1.6" stroke-dasharray="7 5"/><text x="370" y="68" font-size="12.5" font-weight="700" fill="#5A6B86">AWS KMS (Regional)</text><rect x="483.0" y="98.0" width="54" height="54" rx="7" fill="#DD344C"/><text x="510" y="130" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">KMS</text><text x="510" y="167.0" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">KMS key</text><text x="510" y="181.0" font-size="10.5" fill="#5A6B86" text-anchor="middle">never leaves KMS</text><line x1="120" y1="112" x2="480" y2="112" stroke="#232F3E" stroke-width="1.8" marker-end="url(#ah)"/><rect x="243.3" y="93" width="113.4" height="15" rx="3" fill="#ffffff" opacity="0.92"/><text x="300" y="104" font-size="11" fill="#232F3E" text-anchor="middle">1 GenerateDataKey</text><line x1="480" y1="140" x2="120" y2="140" stroke="#232F3E" stroke-width="1.8" marker-end="url(#ah)"/><rect x="196.8" y="149" width="206.4" height="15" rx="3" fill="#ffffff" opacity="0.92"/><text x="300" y="160" font-size="11" fill="#232F3E" text-anchor="middle">2 plaintext + encrypted data key</text><text x="380" y="270" font-size="11" fill="#5A6B86" text-anchor="start">Encrypt API limit: 4 KB</text><text x="380" y="288" font-size="11" fill="#5A6B86" text-anchor="start">Quota per Region → ThrottlingException</text><rect x="700" y="50" width="180" height="280" rx="8" fill="none" stroke="#5A6B86" stroke-width="1.6" stroke-dasharray="7 5"/><text x="710" y="68" font-size="12.5" font-weight="700" fill="#5A6B86">Audit</text><rect x="763.0" y="98.0" width="54" height="54" rx="7" fill="#E7157B"/><text x="790" y="130" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">CT</text><text x="790" y="167.0" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">CloudTrail</text><text x="790" y="181.0" font-size="10.5" fill="#5A6B86" text-anchor="middle">every key call</text><line x1="540" y1="125" x2="760" y2="125" stroke="#232F3E" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="627.4" y="108.0" width="45.2" height="15" rx="3" fill="#ffffff" opacity="0.92"/><text x="650" y="119.0" font-size="11" fill="#232F3E" text-ancho