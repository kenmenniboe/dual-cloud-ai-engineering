<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker></defs><rect width="900" height="340" fill="#ffffff"/><text x="20" y="30" font-size="18" font-weight="700" fill="#232F3E">Module 1 — Three places encryption happens</text><rect x="20" y="50" width="270" height="240" rx="8" fill="none" stroke="#5A6B86" stroke-width="1.6" stroke-dasharray="7 5"/><text x="30" y="68" font-size="12.5" font-weight="700" fill="#5A6B86">In flight (TLS)</text><rect x="53.0" y="103.0" width="54" height="54" rx="7" fill="#232F3E"/><text x="80" y="135" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">USER</text><text x="80" y="172.0" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Customer</text><rect x="193.0" y="103.0" width="54" height="54" rx="7" fill="#8C4FFF"/><text x="220" y="135" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">ALB</text><text x="220" y="172.0" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">ALB</text><text x="220" y="186.0" font-size="10.5" fill="#5A6B86" text-anchor="middle">HTTPS listener</text><line x1="110" y1="130" x2="190" y2="130" stroke="#232F3E" stroke-width="1.8" marker-end="url(#ah)"/><rect x="136.7" y="113.0" width="26.6" height="15" rx="3" fill="#ffffff" opacity="0.92"/><text x="150.0" y="124.0" font-size="11" fill="#232F3E" text-anchor="middle">TLS</text><text x="40" y="240" font-size="11" fill="#5A6B86" text-anchor="start">Protects data on the network</text><text x="40" y="258" font-size="11" fill="#5A6B86" text-anchor="start">Stops man-in-the-middle</text><rect x="310" y="50" width="270" height="240" rx="8" fill="none" stroke="#5A6B86" stroke-width="1.6" stroke-dasharray="7 5"/><text x="320" y="68" font-size="12.5" font-weight="700" fill="#5A6B86">Server-side at rest (SSE)</text><rect x="353.0" y="103.0" width="54" height="54" rx="7" fill="#7AA116"/><text x="380" y="135" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">S3</text><text x="380" y="172.0" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">S3 bucket</text><text x="380" y="186.0" font-size="10.5" fill="#5A6B86" text-anchor="middle">SSE-KMS</text><rect x="493.0" y="103.0" width="54" height="54" rx="7" fill="#DD344C"/><text x="520" y="135" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">KMS</text><text x="520" y="172.0" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">KMS key</text><line x1="410" y1="130" x2="490" y2="130" stroke="#232F3E" stroke-width="1.8" marker-end="url(#ah)"/><rect x="421.2" y="113.0" width="57.6" height="15" rx="3" fill="#ffffff" opacity="0.92"/><text x="450.0" y="124.0" font-size="11" fill="#232F3E" text-anchor="middle">data key</text><text x="330" y="240" font-size="11" fill="#5A6B86" text-anchor="start">AWS service encrypts on write</text><text x="330" y="258" font-size="11" fill="#5A6B86" text-anchor="start">and decrypts on read</text><rect x="600" y="50" width="280" height="240" rx="8" fill="none" stroke="#5A6B86" stroke-width="1.6" stroke-dasharray="7 5"/><text x="610" y="68" font-size="12.5" font-weight="700" fill="#5A6B86">Client-side</text><rect x="643.0" y="103.0" width="54" height="54" rx="7" fill="#232F3E"/><text x="670" y="135" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">APP</text><text x="670" y="172.0" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">Office laptop</text><text x="670" y="186.0" font-size="10.5" fill="#5A6B86" text-anchor="middle">encrypts first</text><rect x="783.0" y="103.0" width="54" height="54" rx="7" fill="#7AA116"/><text x="810" y="135" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">S3</text><text x="810" y="172.0" font-size="12" font-weight="600" fill="#232F3E" text-anchor="middle">S3 bucket</text><text x="810" y="186.0" font-size="10.5" fill="#5A6B86" text-anchor="middle">stores ciphertext</text><line x1="700" y1="130" x2="780" y2="130" stroke="#232F3E" stroke-width="1.8" marker-end="url(#ah)"/><rect x="705.0" y="113.0" width="70.0" height="15" rx="3" fill="#ffffff" opacity="0.92"/><text x="740.0" y="124.0" font-size="11" fill="#232F3E" text-anchor="middle">ciphertext</text><text x="620" y="240" font-size="11" fill="#5A6B86" text-anchor="start">Server never sees plaintext</text><text x="620" y="258" font-size="11" fill="#5A6B86" text-anchor="start">You manage the key</text><rect x="20" y="312" width="12" height="12" rx="2" fill="#7AA116"/><text x="37" y="322" font-size="11" fill="#232F3E">Storage</text><rect x="95.5" y="312" width="12" height="12" rx="2" fill="#8C4FFF"/><text x="112.5" y="322" font-size="11" fill="#232F3E">Networking</text><rect x="190.5" y="312" width="12" height="12" rx="2" fill="#DD344C"/><text x="207.5" y="322" font-size="11" fill="#232F3E">Security</text></svg>