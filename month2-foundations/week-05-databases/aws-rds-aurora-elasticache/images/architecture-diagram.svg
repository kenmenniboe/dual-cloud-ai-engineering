<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect x="0" y="0" width="1000" height="860" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="35" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#16191f" text-anchor="middle">Aurora MySQL + ElastiCache Redis — Hands-On Build</text>
  <text x="500" y="58" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5a6472" text-anchor="middle">AWS SAA Demo — Region: us-east-1</text>

  <!-- Your Mac box -->
  <rect x="60" y="90" width="230" height="95" rx="8" fill="#eef3fb" stroke="#2f5fa3" stroke-width="2"/>
  <text x="175" y="118" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a3a63" text-anchor="middle">Your Mac</text>
  <text x="175" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a3a63" text-anchor="middle">Local Terminal</text>
  <text x="175" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a3a63" text-anchor="middle">mysql-client (Homebrew)</text>
  <text x="175" y="174" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">TLS via global-bundle.pem</text>

  <!-- Default VPC outer box -->
  <rect x="30" y="215" width="940" height="610" rx="10" fill="none" stroke="#8a94a3" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="50" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#3c4453">Default VPC (us-east-1) — 6 subnets across 6 AZs</text>

  <!-- Aurora Cluster box -->
  <rect x="520" y="270" width="410" height="270" rx="8" fill="#fbf3e6" stroke="#c9821f" stroke-width="2"/>
  <text x="725" y="295" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#7a4c0a" text-anchor="middle">Aurora MySQL Cluster: aurora-demo-cluster</text>
  <text x="725" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7a4c0a" text-anchor="middle">Engine: Aurora MySQL 3.10.3 (MySQL 8.0.42)</text>

  <!-- Writer instance -->
  <rect x="545" y="335" width="160" height="100" rx="6" fill="#ffffff" stroke="#c9821f" stroke-width="1.5"/>
  <text x="625" y="358" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a4c0a" text-anchor="middle">Writer Instance</text>
  <text x="625" y="375" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">AZ: us-east-1a</text>
  <text x="625" y="391" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">db.t3.medium</text>
  <text x="625" y="407" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">Accepts reads + writes</text>

  <!-- Reader instance -->
  <rect x="745" y="335" width="160" height="100" rx="6" fill="#ffffff" stroke="#c9821f" stroke-width="1.5"/>
  <text x="825" y="358" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a4c0a" text-anchor="middle">Reader Instance</text>
  <text x="825" y="375" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">AZ: us-east-1b</text>
  <text x="825" y="391" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">db.t3.medium</text>
  <text x="825" y="407" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">Read-only (ERROR 1836 on write)</text>

  <!-- replication arrow -->
  <path d="M 705 385 L 745 385" stroke="#c9821f" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="725" y="375" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7a4c0a" text-anchor="middle">&lt;10ms</text>

  <!-- Writer/Reader endpoint labels -->
  <text x="625" y="325" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#c9821f" text-anchor="middle">Writer Endpoint</text>
  <text x="825" y="325" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#c9821f" text-anchor="middle">Reader Endpoint</text>

  <!-- SG note for Aurora -->
  <rect x="545" y="460" width="360" height="60" rx="6" fill="#ffffff" stroke="#c9821f" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="725" y="480" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#7a4c0a" text-anchor="middle">demo-aurora-sg</text>
  <text x="725" y="496" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6472" text-anchor="middle">TCP 3306 from My IP · Public access: Yes</text>
  <text x="725" y="511" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6472" text-anchor="middle">Port 3306 · Aurora Standard storage</text>

  <!-- Arrows from Mac to Writer and Reader -->
  <path d="M 290 137 C 400 137, 400 300, 545 360" stroke="#2f5fa3" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="400" y="220" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1a3a63">writer endpoint · 3306</text>

  <path d="M 290 155 C 460 200, 600 260, 745 385" stroke="#2f5fa3" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="470" y="270" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1a3a63">reader endpoint · 3306 (read-only)</text>

  <!-- Public subnet box -->
  <rect x="60" y="580" width="270" height="180" rx="8" fill="#eef6f0" stroke="#2f8a4b" stroke-width="2"/>
  <text x="195" y="605" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e5c31" text-anchor="middle">Public Subnet</text>

  <!-- EC2 client box -->
  <rect x="80" y="620" width="230" height="110" rx="6" fill="#ffffff" stroke="#2f8a4b" stroke-width="1.5"/>
  <text x="195" y="645" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e5c31" text-anchor="middle">EC2 Client Instance</text>
  <text x="195" y="663" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">Amazon Linux 2023, t3.micro</text>
  <text x="195" y="680" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">redis6-cli installed</text>
  <text x="195" y="697" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">SSH access from My IP</text>
  <text x="195" y="714" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8a94a3" text-anchor="middle">(needed — ElastiCache has no</text>
  <text x="195" y="727" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8a94a3" text-anchor="middle">public access option)</text>

  <!-- ElastiCache box -->
  <rect x="400" y="600" width="290" height="130" rx="8" fill="#fdeef0" stroke="#b23a52" stroke-width="2"/>
  <text x="545" y="625" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a2436" text-anchor="middle">ElastiCache Redis</text>
  <text x="545" y="643" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">demo-redis-cluster</text>
  <text x="545" y="660" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">cache.t3.micro · single node (0 replicas)</text>
  <text x="545" y="677" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6472" text-anchor="middle">Cluster mode: Disabled · Port 6379</text>
  <text x="545" y="700" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#7a2436" text-anchor="middle">VPC-internal only — no public endpoint</text>

  <!-- Arrow EC2 -> ElastiCache -->
  <path d="M 310 675 L 400 665" stroke="#2f8a4b" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="355" y="650" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e5c31" text-anchor="middle">TCP 6379</text>

  <!-- Shared SG note -->
  <rect x="400" y="760" width="470" height="55" rx="6" fill="#ffffff" stroke="#b23a52" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="635" y="780" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#7a2436" text-anchor="middle">sg-01ea045a2574724af (shared by EC2 + Redis)</text>
  <text x="635" y="797" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5a6472" text-anchor="middle">Self-referencing rule: all traffic from this SG · SSH 22 from My IP</text>
  <text x="635" y="810" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#8a94a3" text-anchor="middle">Tighter practice: scope self-reference to TCP 6379 only</text>

  <!-- Legend -->
  <text x="50" y="845" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#8a94a3">Blue = Aurora traffic (public, TLS)   Green = EC2→Redis (VPC-internal)   Orange = Aurora storage replication</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f5fa3"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f8a4b"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c9821f"/>
    </marker>
  </defs>
</svg>
