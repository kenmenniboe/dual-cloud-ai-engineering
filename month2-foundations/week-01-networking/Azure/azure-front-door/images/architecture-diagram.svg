<svg width="800" height="760" viewBox="0 0 800 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#be185d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="800" height="760" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">Azure Front Door — Lab Architecture</text>

  <!-- User -->
  <rect x="300" y="55" width="200" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="400" y="85" text-anchor="middle" font-size="15" fill="#334155">User (browser)</text>

  <!-- Endpoint -->
  <rect x="230" y="150" width="340" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#5b21b6">Front Door endpoint</text>
  <text x="400" y="198" text-anchor="middle" font-size="12" fill="#5b21b6">Standard tier • HTTPS redirect enabled</text>

  <!-- Rule set (side, dashed) -->
  <rect x="40" y="280" width="230" height="70" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="155" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#9d174d">Rule set</text>
  <text x="155" y="328" text-anchor="middle" font-size="11" fill="#9d174d">Geo-match condition</text>
  <text x="155" y="343" text-anchor="middle" font-size="11" fill="#9d174d">Action: URL redirect (308)</text>

  <!-- Origin group -->
  <rect x="290" y="280" width="280" height="70" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="430" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#0f766e">default-origin-group</text>
  <text x="430" y="328" text-anchor="middle" font-size="11" fill="#0f766e">Equal priority + weight</text>
  <text x="430" y="343" text-anchor="middle" font-size="11" fill="#0f766e">→ round-robin distribution</text>

  <!-- App01 -->
  <rect x="230" y="420" width="200" height="70" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="330" y="448" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">menniboe-app01</text>
  <text x="330" y="468" text-anchor="middle" font-size="11" fill="#9a3412">App Service · Central US</text>

  <!-- App02 -->
  <rect x="460" y="420" width="200" height="70" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="560" y="448" text-anchor="middle" font-size="14" font-weight="600" fill="#9a3412">menniboe-app02</text>
  <text x="560" y="468" text-anchor="middle" font-size="11" fill="#9a3412">App Service · Canada Central</text>

  <!-- Access restriction note -->
  <rect x="290" y="520" width="280" height="46" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="430" y="540" text-anchor="middle" font-size="11" fill="#475569">Networking → Access restrictions</text>
  <text x="430" y="556" text-anchor="middle" font-size="11" fill="#475569">must allow Front Door if locked down</text>

  <!-- Arrows: main path -->
  <line x1="400" y1="105" x2="400" y2="150" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="220" x2="400" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="350" x2="335" y2="420" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="350" x2="525" y2="420" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: endpoint to rule set -->
  <path d="M 260 210 L 200 210 L 200 280" fill="none" stroke="#be185d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-pink)"/>

  <!-- Arrow: rule set redirect straight to app02 (bypasses Front Door) -->
  <path d="M 240 340 C 400 400, 430 380, 470 420" fill="none" stroke="#be185d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-pink)"/>
  <text x="360" y="392" text-anchor="middle" font-size="10.5" fill="#9d174d">308 redirect — bypasses Front Door</text>

  <!-- Legend -->
  <rect x="40" y="600" width="720" height="140" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="626" font-size="13" font-weight="600" fill="#0f172a">Legend</text>

  <line x1="60" y1="645" x2="95" y2="645" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="105" y="649" font-size="12" fill="#334155">Default routing path (stays inside Front Door)</text>

  <line x1="60" y1="668" x2="95" y2="668" stroke="#be185d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-pink)"/>
  <text x="105" y="672" font-size="12" fill="#334155">Rule set override — URL redirect sends the browser directly to the origin (leaves Front Door)</text>

  <rect x="60" y="686" width="18" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="86" y="697" font-size="12" fill="#334155">Front Door (endpoint)</text>
  <rect x="240" y="686" width="18" height="14" rx="3" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="266" y="697" font-size="12" fill="#334155">Origin group</text>
  <rect x="380" y="686" width="18" height="14" rx="3" fill="#ffedd5" stroke="#ea580c"/>
  <text x="406" y="697" font-size="12" fill="#334155">Origin (App Service)</text>
  <rect x="540" y="686" width="18" height="14" rx="3" fill="#fce7f3" stroke="#be185d" stroke-dasharray="3 2"/>
  <text x="566" y="697" font-size="12" fill="#334155">Rule set (control-plane override)</text>

  <text x="60" y="720" font-size="11" fill="#64748b">Standard tier used throughout — no Private Link required for publicly reachable origins.</text>
</svg>
