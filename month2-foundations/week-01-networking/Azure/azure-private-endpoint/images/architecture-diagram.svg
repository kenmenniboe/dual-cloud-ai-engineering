<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="460" fill="#ffffff"/>

  <!-- VNet boundary -->
  <rect x="30" y="40" width="440" height="380" rx="10" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="45" y="65" font-size="15" fill="#0078D4" font-weight="bold">VNet: vnet-pe-lab (10.0.0.0/16)</text>

  <!-- Bastion subnet -->
  <rect x="50" y="80" width="180" height="100" rx="6" fill="#EAF3FB" stroke="#0078D4"/>
  <text x="60" y="98" font-size="12" fill="#0078D4">AzureBastionSubnet</text>
  <rect x="65" y="110" width="150" height="50" rx="4" fill="#0078D4"/>
  <text x="90" y="140" font-size="12" fill="#ffffff">Bastion</text>

  <!-- App subnet -->
  <rect x="50" y="200" width="400" height="190" rx="6" fill="#EAF3FB" stroke="#0078D4"/>
  <text x="60" y="218" font-size="12" fill="#0078D4">snet-app (10.0.1.0/24)</text>

  <rect x="65" y="235" width="140" height="55" rx="4" fill="#605E5C"/>
  <text x="80" y="260" font-size="12" fill="#ffffff">vm-jumpbox</text>
  <text x="80" y="276" font-size="10" fill="#ffffff">(no public IP)</text>

  <rect x="240" y="235" width="180" height="55" rx="4" fill="#107C10"/>
  <text x="255" y="258" font-size="12" fill="#ffffff">Private Endpoint NIC</text>
  <text x="255" y="274" font-size="11" fill="#ffffff">10.0.0.5 (example)</text>

  <!-- Private DNS Zone -->
  <rect x="65" y="320" width="355" height="50" rx="4" fill="#5C2D91"/>
  <text x="80" y="350" font-size="12" fill="#ffffff">Private DNS Zone: privatelink.database.windows.net (linked to VNet)</text>

  <!-- Arrows: jumpbox -> PE NIC -->
  <line x1="205" y1="262" x2="240" y2="262" stroke="#107C10" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PE NIC -> DNS zone -->
  <line x1="330" y1="290" x2="330" y2="320" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- SQL Server outside VNet -->
  <rect x="560" y="235" width="160" height="55" rx="4" fill="#D83B01"/>
  <text x="575" y="258" font-size="12" fill="#ffffff">Azure SQL Server</text>
  <text x="575" y="274" font-size="10" fill="#ffffff">Public access: Disabled</text>

  <!-- PE NIC -> SQL Server (private link, solid) -->
  <line x1="420" y1="262" x2="560" y2="262" stroke="#107C10" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="435" y="252" font-size="10" fill="#107C10">Private Link (allowed)</text>

  <!-- External client blocked -->
  <rect x="560" y="80" width="160" height="55" rx="4" fill="#A19F9D"/>
  <text x="575" y="103" font-size="12" fill="#ffffff">External Client</text>
  <text x="575" y="119" font-size="10" fill="#ffffff">(public internet)</text>

  <line x1="640" y1="135" x2="640" y2="235" stroke="#D83B01" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="648" y="185" font-size="18" fill="#D83B01">&#10005;</text>
  <text x="500" y="200" font-size="10" fill="#D83B01">Blocked: Error 47073</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#107C10"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5C2D91"/>
    </marker>
  </defs>
</svg>
