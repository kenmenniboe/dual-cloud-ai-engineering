<svg viewBox="0 0 1000 860" width="1000" height="860" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="860" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">AWS High Availability Lab — Final Architecture</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#64748B">Application Load Balancer + Network Load Balancer + Auto Scaling Group</text>

  <!-- Client -->
  <rect x="430" y="72" width="140" height="44" rx="8" fill="#334155"/>
  <text x="500" y="99" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="600">Internet / Users</text>

  <!-- Arrows client -> LBs -->
  <line x1="470" y1="116" x2="290" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="140" font-size="11" fill="#475569">HTTP / HTTPS</text>
  <line x1="530" y1="116" x2="710" y2="168" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="140" font-size="11" fill="#475569">TCP / TLS</text>

  <!-- ALB box -->
  <rect x="110" y="170" width="300" height="100" rx="8" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="260" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Application Load Balancer</text>
  <text x="260" y="214" text-anchor="middle" font-size="12" fill="#BFDBFE">DemoALB</text>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#DBEAFE">Listener: HTTP:80 → HTTPS:443</text>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#DBEAFE">SG: demo-sg-load-balancer</text>

  <!-- NLB box -->
  <rect x="590" y="170" width="300" height="100" rx="8" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="740" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Network Load Balancer</text>
  <text x="740" y="214" text-anchor="middle" font-size="12" fill="#BFDBFE">DemoNLB</text>
  <text x="740" y="234" text-anchor="middle" font-size="11" fill="#DBEAFE">Listener: TCP:80 → TLS:443</text>
  <text x="740" y="250" text-anchor="middle" font-size="11" fill="#DBEAFE">SG: demo-sg-nlb (static IP per AZ)</text>

  <!-- Arrows LB -> TG -->
  <line x1="260" y1="270" x2="260" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="270" x2="740" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Target Groups -->
  <rect x="110" y="310" width="300" height="78" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="260" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#0C4A6E">Target Group: demo-tg-alb</text>
  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#0C4A6E">Protocol: HTTP:80</text>
  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#0C4A6E">Health check: HTTP /</text>

  <rect x="590" y="310" width="300" height="78" rx="8" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
  <text x="740" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#0C4A6E">Target Group: demo-tg-nlb</text>
  <text x="740" y="350" text-anchor="middle" font-size="11" fill="#0C4A6E">Protocol: TCP:80</text>
  <text x="740" y="366" text-anchor="middle" font-size="11" fill="#0C4A6E">Health check: HTTP</text>

  <!-- Arrows TG -> ASG -->
  <line x1="260" y1="388" x2="260" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="388" x2="740" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ASG container -->
  <rect x="70" y="420" width="860" height="270" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="92" y="446" font-size="14" font-weight="700" fill="#334155">Auto Scaling Group: Demo ASG</text>
  <text x="92" y="463" font-size="11" fill="#475569">Min 1 · Desired 1–2 · Max 3 · Launch template: my-demo-template</text>

  <!-- AZ A -->
  <rect x="100" y="478" width="250" height="190" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="225" y="498" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Availability Zone A</text>
  <rect x="125" y="512" width="200" height="120" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <text x="225" y="533" text-anchor="middle" font-size="12" font-weight="700" fill="#78350F">EC2 (t2.micro)</text>
  <text x="225" y="550" text-anchor="middle" font-size="11" fill="#78350F">Apache httpd</text>
  <text x="225" y="567" text-anchor="middle" font-size="11" fill="#78350F">"Hello World" + instance ID</text>
  <text x="225" y="587" text-anchor="middle" font-size="10" fill="#78350F">SG: launch-wizard-1</text>
  <text x="225" y="602" text-anchor="middle" font-size="10" fill="#78350F">(trusts ALB SG + NLB SG)</text>

  <!-- AZ B -->
  <rect x="380" y="478" width="250" height="190" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="505" y="498" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Availability Zone B</text>
  <rect x="405" y="512" width="200" height="120" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <text x="505" y="533" text-anchor="middle" font-size="12" font-weight="700" fill="#78350F">EC2 (t2.micro)</text>
  <text x="505" y="550" text-anchor="middle" font-size="11" fill="#78350F">Apache httpd</text>
  <text x="505" y="567" text-anchor="middle" font-size="11" fill="#78350F">"Hello World" + instance ID</text>
  <text x="505" y="587" text-anchor="middle" font-size="10" fill="#78350F">SG: launch-wizard-1</text>
  <text x="505" y="602" text-anchor="middle" font-size="10" fill="#78350F">(trusts ALB SG + NLB SG)</text>

  <!-- AZ C (scale-out) -->
  <rect x="660" y="478" width="250" height="190" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="785" y="498" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Availability Zone C</text>
  <rect x="685" y="512" width="200" height="120" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.85"/>
  <text x="785" y="533" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">EC2 (t2.micro)</text>
  <text x="785" y="553" text-anchor="middle" font-size="11" fill="#92400E">Added on scale-out</text>
  <text x="785" y="571" text-anchor="middle" font-size="11" fill="#92400E">(target tracking: CPU 40%)</text>
  <text x="785" y="591" text-anchor="middle" font-size="10" fill="#92400E">Up to Max = 3</text>

  <!-- CloudWatch -->
  <rect x="650" y="720" width="280" height="90" rx="8" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <text x="790" y="744" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">CloudWatch Alarms</text>
  <text x="790" y="762" text-anchor="middle" font-size="11" fill="#D1FAE5">AlarmHigh: CPU &gt; 40% → scale-out</text>
  <text x="790" y="778" text-anchor="middle" font-size="11" fill="#D1FAE5">AlarmLow: CPU &lt; 28% → scale-in</text>
  <text x="790" y="795" text-anchor="middle" font-size="10" fill="#D1FAE5">Target tracking policy, target = 40% CPU</text>

  <!-- Arrow ASG <-> CloudWatch -->
  <line x1="790" y1="690" x2="790" y2="720" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="720" x2="800" y2="690" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="810" y="708" font-size="10" fill="#475569">metrics / actions</text>

  <!-- Legend -->
  <rect x="70" y="720" width="420" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="90" y="742" font-size="12" font-weight="700" fill="#334155">Legend</text>

  <rect x="90" y="754" width="16" height="16" rx="3" fill="#1E3A5F"/>
  <text x="114" y="767" font-size="11" fill="#334155">Load balancer (network layer)</text>

  <rect x="90" y="777" width="16" height="16" rx="3" fill="#FDE68A" stroke="#D97706"/>
  <text x="114" y="790" font-size="11" fill="#334155">Compute — EC2 managed by ASG</text>

  <rect x="90" y="800" width="16" height="16" rx="3" fill="#059669"/>
  <text x="114" y="813" font-size="11" fill="#334155">Monitoring / scaling trigger</text>

  <rect x="300" y="754" width="16" height="16" rx="3" fill="#E0F2FE" stroke="#0284C7"/>
  <text x="324" y="767" font-size="11" fill="#334155">Target group</text>

  <rect x="300" y="777" width="16" height="10" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="324" y="790" font-size="11" fill="#334155">Logical grouping (ASG / AZ)</text>
</svg>
