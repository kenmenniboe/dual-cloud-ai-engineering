<svg xmlns='http://www.w3.org/2000/svg' width='760' height='330' viewBox='0 0 760 330'><defs></defs><rect x='0' y='0' width='760' height='330' fill='#FFFFFF'/><text x='380.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='18' font-weight='bold' fill='#232F3E'>Module 3: VPC limits and CIDR blocks</text><rect x='30' y='50' width='700' height='230' rx='6' fill='none' stroke='#545B64' stroke-width='1.5' stroke-dasharray='7 5'/><text x='42' y='70' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#545B64'>Region us-east-1 (up to 5 VPCs, soft limit)</text><rect x='50' y='85' width='400' height='180' rx='6' fill='none' stroke='#8C4FFF' stroke-width='1.5' stroke-dasharray='7 5'/><text x='62' y='105' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#8C4FFF'>menniboe-vpc (up to 5 CIDR blocks)</text><rect x='70' y='120' width='360' height='46' rx='5' fill='#EEEDFE' stroke='#8C4FFF' stroke-width='1'/><text x='250.0' y='139.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#232F3E'>Primary 10.0.0.0/16</text><text x='250.0' y='155.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12'  fill='#232F3E'>Set at creation, permanent</text><rect x='70' y='180' width='360' height='46' rx='5' fill='#E1F5EE' stroke='#1D9E75' stroke-width='1'/><text x='250.0' y='199.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#232F3E'>Secondary 10.1.0.0/16</text><text x='250.0' y='215.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12'  fill='#232F3E'>Added later to grow</text><rect x='470' y='85' width='240' height='180' rx='6' fill='none' stroke='#8C4FFF' stroke-width='1.5' stroke-dasharray='7 5'/><text x='482' y='105' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='13' font-weight='bold' fill='#8C4FFF'>Default VPC</text><rect x='490' y='150' width='200' height='46' rx='5' fill='#EEEDFE' stroke='#8C4FFF' stroke-width='1'/><text x='590.0' y='169.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#232F3E'>172.31.0.0/16</text><text x='590.0' y='185.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12'  fill='#232F3E'>Must not overlap if connected</text><text x='380' y='305' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12'  fill='#545B64'>Each block: /28 (16 IPs) to /16 (65,536 IPs). Plan ranges with an IP plan or VPC IPAM.</text></svg>