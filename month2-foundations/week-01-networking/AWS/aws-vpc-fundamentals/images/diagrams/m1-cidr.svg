<svg xmlns='http://www.w3.org/2000/svg' width='760' height='270' viewBox='0 0 760 270'><defs></defs><rect x='0' y='0' width='760' height='270' fill='#FFFFFF'/><text x='380.0' y='30' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='18' font-weight='bold' fill='#232F3E'>Module 1: CIDR splits 32 bits into network and host parts</text><text x='40' y='70' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#232F3E'>10.0.0.0/16</text><rect x='40' y='80' width='340' height='44' rx='5' fill='#EEEDFE' stroke='#8C4FFF' stroke-width='1'/><text x='210.0' y='106.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#232F3E'>16 network bits (fixed)</text><rect x='380' y='80' width='340' height='44' rx='5' fill='#E1F5EE' stroke='#1D9E75' stroke-width='1'/><text x='550.0' y='106.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#232F3E'>16 host bits = 65,536 IPs</text><text x='40' y='160' text-anchor='start' font-family='Arial, Helvetica, sans-serif' font-size='14' font-weight='bold' fill='#232F3E'>10.0.1.0/24</text><rect x='40' y='170' width='510' height='44' rx='5' fill='#EEEDFE' stroke='#8C4FFF' stroke-width='1'/><text x='295.0' y='196.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#232F3E'>24 network bits (fixed)</text><rect x='550' y='170' width='170' height='44' rx='5' fill='#E1F5EE' stroke='#1D9E75' stroke-width='1'/><text x='635.0' y='196.0' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12' font-weight='bold' fill='#232F3E'>8 bits = 256 IPs</text><text x='380' y='248' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-size='12'  fill='#545B64'>Addresses in a block = 2^(32 - prefix). Smaller prefix number = bigger range.</text></svg>