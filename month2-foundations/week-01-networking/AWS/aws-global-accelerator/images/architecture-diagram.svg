<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="860" fill="#ffffff"/>

  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2a1f">AWS Global Accelerator — Two-Region Failover Lab</text>
  <text x="500" y="62" text-anchor="middle" font-size="13.5" fill="#5b6c59">2 static anycast IPs · Layer 4 TCP · no caching · health-check failover under a minute</text>

  <!-- USERS -->
  <rect x="370" y="86" width="260" height="46" rx="8" fill="#e8f3e1" stroke="#7aa36b" stroke-width="1.5"/>
  <text x="500" y="115" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#234d23">USERS (worldwide)</text>

  <line x1="500" y1="132" x2="500" y2="158" stroke="#5b6c59" stroke-width="2"/>
  <polygon points="500,166 494,154 506,154" fill="#5b6c59"/>

  <!-- ANYCAST IPs -->
  <rect x="250" y="168" width="500" height="62" rx="8" fill="#f6eefb" stroke="#7a4da5" stroke-width="2"/>
  <text x="500" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a2f80">2 STATIC ANYCAST IPs</text>
  <text x="500" y="213" text-anchor="middle" font-size="12.5" fill="#5a2f80">13.248.164.141 · 166.117.249.189 — advertised from every edge, never change</text>

  <line x1="500" y1="230" x2="500" y2="256" stroke="#5b6c59" stroke-width="2"/>
  <polygon points="500,264 494,252 506,252" fill="#5b6c59"/>

  <!-- EDGE -->
  <rect x="120" y="266" width="760" height="54" rx="8" fill="#fff4e0" stroke="#c9892b" stroke-width="1.5"/>
  <text x="500" y="289" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5c10">NEAREST AWS EDGE LOCATION</text>
  <text x="500" y="309" text-anchor="middle" font-size="12.5" fill="#8a5c10">few public-internet hops in · NO CACHING · every request continues to an endpoint</text>

  <line x1="300" y1="320" x2="300" y2="362" stroke="#7a4da5" stroke-width="2.5"/>
  <polygon points="300,370 294,358 306,358" fill="#7a4da5"/>
  <line x1="700" y1="320" x2="700" y2="362" stroke="#7a4da5" stroke-width="2.5"/>
  <polygon points="700,370 694,358 706,358" fill="#7a4da5"/>
  <text x="500" y="348" text-anchor="middle" font-size="12" font-style="italic" fill="#5a2f80">AWS private global backbone</text>

  <!-- ACCELERATOR HIERARCHY label -->
  <rect x="120" y="374" width="760" height="34" rx="6" fill="#eef4fb" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="500" y="396" text-anchor="middle" font-size="13" fill="#1d4d7c">Accelerator "ga-demo" → Listener: TCP 80, client affinity None → Endpoint groups</text>

  <!-- ENDPOINT GROUP 1 -->
  <rect x="100" y="428" width="360" height="176" rx="10" fill="#f7f9f5" stroke="#7aa36b" stroke-width="1.5"/>
  <text x="280" y="454" text-anchor="middle" font-size="15" font-weight="bold" fill="#234d23">ENDPOINT GROUP — us-east-1</text>
  <text x="280" y="478" text-anchor="middle" font-size="12.5" fill="#3c4d3a">Traffic dial 100%</text>
  <text x="280" y="500" text-anchor="middle" font-size="12.5" fill="#3c4d3a">Health check: HTTP  /  :80</text>
  <text x="280" y="521" text-anchor="middle" font-size="12.5" fill="#3c4d3a">interval 10s · threshold 2 → detect ~20s</text>
  <rect x="150" y="536" width="260" height="52" rx="8" fill="#ffffff" stroke="#7aa36b" stroke-width="1.2"/>
  <text x="280" y="557" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#234d23">EC2 — Amazon Linux 2023</text>
  <text x="280" y="576" text-anchor="middle" font-size="12" fill="#3c4d3a">Apache · weight 128 · "US-EAST-1"</text>

  <!-- ENDPOINT GROUP 2 -->
  <rect x="540" y="428" width="360" height="176" rx="10" fill="#f7f9f5" stroke="#7aa36b" stroke-width="1.5"/>
  <text x="720" y="454" text-anchor="middle" font-size="15" font-weight="bold" fill="#234d23">ENDPOINT GROUP — eu-west-1</text>
  <text x="720" y="478" text-anchor="middle" font-size="12.5" fill="#3c4d3a">Traffic dial 100%</text>
  <text x="720" y="500" text-anchor="middle" font-size="12.5" fill="#3c4d3a">Health check: HTTP  /  :80</text>
  <text x="720" y="521" text-anchor="middle" font-size="12.5" fill="#3c4d3a">interval 10s · threshold 2 → detect ~20s</text>
  <rect x="590" y="536" width="260" height="52" rx="8" fill="#ffffff" stroke="#7aa36b" stroke-width="1.2"/>
  <text x="720" y="557" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#234d23">EC2 — Amazon Linux 2023</text>
  <text x="720" y="576" text-anchor="middle" font-size="12" fill="#3c4d3a">Apache · weight 128 · "EU-WEST-1"</text>

  <!-- FAILOVER ARROW -->
  <path d="M 460 562 L 590 562" stroke="#b5342b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <polygon points="598,562 586,556 586,568" fill="#b5342b"/>
  <text x="525" y="552" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b5342b">failover</text>

  <!-- OBSERVED RESULTS -->
  <rect x="100" y="632" width="800" height="150" rx="10" fill="#f3f8ef" stroke="#7aa36b" stroke-width="1.5"/>
  <text x="500" y="658" text-anchor="middle" font-size="15" font-weight="bold" fill="#234d23">OBSERVED RESULTS</text>
  <text x="500" y="684" text-anchor="middle" font-size="12.5" fill="#3c4d3a">Normal: both IPs and the DNS name all resolved to us-east-1 (nearest) — anycast proven</text>
  <text x="500" y="706" text-anchor="middle" font-size="12.5" fill="#3c4d3a">Failover: stopped us-east-1 → ~50s of timeouts → traffic moved to eu-west-1</text>
  <text x="500" y="728" text-anchor="middle" font-size="12.5" fill="#3c4d3a">Failback: restarted us-east-1 → returned to us-east-1 with ZERO dropped requests</text>
  <text x="500" y="752" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5c10">The client IP never changed — same address, different region answering</text>
  <text x="500" y="772" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5b6c59">Control plane lives in us-west-2 · CLI delete does NOT cascade</text>

  <text x="500" y="820" text-anchor="middle" font-size="12.5" fill="#5b6c59">Azure anchor — Global Accelerator ≈ Azure cross-region (global) Load Balancer</text>
  <text x="500" y="842" text-anchor="middle" font-size="12.5" fill="#5b6c59">Client affinity ≈ Azure Load Balancer session persistence (5-tuple vs Client IP)</text>
</svg>
