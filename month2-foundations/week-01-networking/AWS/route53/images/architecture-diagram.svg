<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1000" height="860" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Route 53 Lab — Final Architecture (menniboefarm.com)</text>

  <!-- Client -->
  <rect x="40" y="70" width="180" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="130" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Client (browser)</text>
  <text x="130" y="120" text-anchor="middle" font-size="12" fill="#374151">DNS query → HTTP request</text>

  <!-- Local resolver -->
  <rect x="280" y="70" width="180" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="370" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Local DNS resolver</text>
  <text x="370" y="120" text-anchor="middle" font-size="12" fill="#374151">recursive + cache (TTL)</text>

  <!-- CloudShell -->
  <rect x="780" y="70" width="180" height="70" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="870" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">AWS CloudShell</text>
  <text x="870" y="120" text-anchor="middle" font-size="12" fill="#374151">us-east-1 · dig / nslookup</text>

  <!-- Route 53 hosted zone -->
  <rect x="200" y="190" width="600" height="230" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="500" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">Amazon Route 53 — Public Hosted Zone: menniboefarm.com</text>
  <text x="500" y="238" text-anchor="middle" font-size="12" fill="#5b21b6">Authoritative DNS · NS (4 × awsdns) + SOA · 100% SLA · port 53</text>

  <g font-size="12" fill="#1f2937">
    <text x="225" y="268" font-weight="600">Records created:</text>
    <text x="225" y="290">• test → A (Simple)</text>
    <text x="225" y="308">• myapp → CNAME → ALB</text>
    <text x="225" y="326">• myalias → A Alias → ALB</text>
    <text x="225" y="344">• @ (apex) → A Alias → ALB</text>
    <text x="225" y="362">• simple → A (2 values)</text>
    <text x="500" y="290">• weighted → 10 / 70 / 20</text>
    <text x="500" y="308">• latency → 3 regions</text>
    <text x="500" y="326">• failover → primary / secondary</text>
    <text x="500" y="344">• geo → Asia / US / Default</text>
    <text x="500" y="362">• multi → multivalue + health checks</text>
  </g>
  <rect x="225" y="380" width="550" height="26" rx="6" fill="#ede9fe"/>
  <text x="500" y="398" text-anchor="middle" font-size="12" fill="#4c1d95">Health checks: eu-central-1 · us-east-1 · ap-southeast-1 · calculated-all (parent)</text>

  <!-- Health checkers -->
  <rect x="40" y="470" width="180" height="90" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="130" y="497" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Route 53 Health Checkers</text>
  <text x="130" y="517" text-anchor="middle" font-size="11" fill="#7c2d12">8 regions × 2 = ~16 checkers</text>
  <text x="130" y="534" text-anchor="middle" font-size="11" fill="#7c2d12">IP range 15.177.x.x</text>
  <text x="130" y="551" text-anchor="middle" font-size="11" fill="#7c2d12">HTTP :80 / every 30 s</text>

  <!-- Region: eu-central-1 -->
  <rect x="250" y="470" width="230" height="300" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="365" y="496" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">eu-central-1 (Frankfurt)</text>
  <rect x="270" y="512" width="190" height="60" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="365" y="536" text-anchor="middle" font-size="12" font-weight="600" fill="#064e3b">ALB: DemoRoute53ALB</text>
  <text x="365" y="554" text-anchor="middle" font-size="11" fill="#064e3b">HTTP :80 → demo-tg-route53</text>
  <line x1="365" y1="572" x2="365" y2="610" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="612" width="190" height="80" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="365" y="636" text-anchor="middle" font-size="12" font-weight="600" fill="#064e3b">EC2 route53-demo-eu</text>
  <text x="365" y="654" text-anchor="middle" font-size="11" fill="#064e3b">t2.micro · Amazon Linux 2023</text>
  <text x="365" y="672" text-anchor="middle" font-size="11" fill="#064e3b">httpd + user-data (IMDSv2)</text>
  <text x="365" y="720" text-anchor="middle" font-size="11" fill="#065f46">SG route53-demo-sg: 22, 80 from 0.0.0.0/0</text>
  <text x="365" y="745" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">"Hello World … AZ eu-central-1b"</text>

  <!-- Region: us-east-1 -->
  <rect x="510" y="470" width="230" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="625" y="496" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">us-east-1 (N. Virginia)</text>
  <rect x="530" y="612" width="190" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="625" y="636" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">EC2 route53-demo-us</text>
  <text x="625" y="654" text-anchor="middle" font-size="11" fill="#1e3a8a">t2.micro · Amazon Linux 2023</text>
  <text x="625" y="672" text-anchor="middle" font-size="11" fill="#1e3a8a">httpd + user-data (IMDSv2)</text>
  <text x="625" y="720" text-anchor="middle" font-size="11" fill="#1e3a8a">SG route53-demo-sg: 22, 80 from 0.0.0.0/0</text>
  <text x="625" y="745" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">"Hello World … AZ us-east-1b"</text>
  <text x="625" y="560" text-anchor="middle" font-size="11" fill="#1e40af">Failover SECONDARY · Geo: United States</text>

  <!-- Region: ap-southeast-1 -->
  <rect x="770" y="470" width="190" height="300" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2.5"/>
  <text x="865" y="496" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">ap-southeast-1</text>
  <text x="865" y="514" text-anchor="middle" font-size="12" fill="#713f12">(Singapore)</text>
  <rect x="785" y="612" width="160" height="80" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="865" y="636" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">EC2 route53-demo-ap</text>
  <text x="865" y="654" text-anchor="middle" font-size="11" fill="#713f12">t2.micro · AL2023</text>
  <text x="865" y="672" text-anchor="middle" font-size="11" fill="#713f12">httpd + user-data</text>
  <text x="865" y="720" text-anchor="middle" font-size="11" fill="#713f12">SG: port 80 removed → Unhealthy</text>
  <text x="865" y="745" text-anchor="middle" font-size="11" font-weight="600" fill="#713f12">"… AZ ap-southeast-1b"</text>
  <text x="865" y="560" text-anchor="middle" font-size="11" fill="#854d0e">Geo: Asia · Weighted 10</text>

  <!-- Arrows client -> resolver -> Route 53 -->
  <line x1="220" y1="105" x2="278" y2="105" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="140" x2="370" y2="188" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="140" x2="740" y2="192" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="172" font-size="11" fill="#374151">dig / nslookup</text>

  <!-- Route 53 -> regions (DNS answers) -->
  <line x1="365" y1="420" x2="365" y2="468" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="625" y1="420" x2="625" y2="468" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="700" y1="420" x2="865" y2="468" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="440" y="447" font-size="11" fill="#5b21b6">DNS answers (IP / alias)</text>

  <!-- Health checkers -> instances -->
  <line x1="220" y1="515" x2="268" y2="640" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="220" y1="530" x2="528" y2="650" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <line x1="220" y1="545" x2="783" y2="660" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowRed)"/>
  <text x="600" y="600" font-size="11" fill="#dc2626">✗ timeout (SG blocked)</text>

  <!-- Client HTTP direct to resource -->
  <path d="M 130 140 C 130 300, 200 400, 300 610" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="330" font-size="11" fill="#374151">HTTP directly to</text>
  <text x="70" y="346" font-size="11" fill="#374151">resolved IP — traffic</text>
  <text x="70" y="362" font-size="11" fill="#374151">never passes Route 53</text>

  <!-- Legend -->
  <rect x="40" y="790" width="920" height="50" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <line x1="60" y1="815" x2="100" y2="815" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="108" y="819" font-size="11" fill="#374151">DNS response (routing policy decides which IP)</text>
  <line x1="370" y1="815" x2="410" y2="815" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="418" y="819" font-size="11" fill="#374151">Health check probe (HTTP :80, 2xx/3xx = healthy)</text>
  <line x1="700" y1="815" x2="740" y2="815" stroke="#374151" stroke-width="2"/>
  <text x="748" y="819" font-size="11" fill="#374151">Client traffic (DNS then HTTP)</text>
</svg>
