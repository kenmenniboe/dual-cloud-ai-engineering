<svg viewBox="0 0 1000 860" width="1000" height="860" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="860" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">S3 Lab — Final Architecture</text>
  <text x="500" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">menniboe-farm-s3-lab-&lt;account-id&gt;-us-east-1-&lt;suffix&gt;</text>

  <!-- Actor: Public Internet User -->
  <rect x="60" y="90" width="260" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="115" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">Public Internet User</text>
  <text x="190" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">anonymous, no credentials</text>

  <!-- Actor: Authenticated AWS User -->
  <rect x="680" y="90" width="260" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="810" y="115" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#78350f" text-anchor="middle">Authenticated AWS User</text>
  <text x="810" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle">generates pre-signed URL</text>

  <!-- Bucket outer container -->
  <rect x="60" y="190" width="880" height="440" rx="14" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
  <text x="80" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">S3 Bucket (General Purpose, Account Regional namespace)</text>
  <text x="80" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4b5563">Versioning: Enabled &#160;|&#160; Block Public Access: Off &#160;|&#160; Default Encryption: SSE-S3</text>

  <!-- Bucket Policy box -->
  <rect x="90" y="250" width="380" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="280" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4c1d95" text-anchor="middle">Bucket Policy</text>
  <text x="102" y="288" font-family="Consolas, monospace" font-size="10" fill="#4c1d95">"Effect": "Allow"</text>
  <text x="102" y="303" font-family="Consolas, monospace" font-size="10" fill="#4c1d95">"Principal": "*"</text>
  <text x="102" y="318" font-family="Consolas, monospace" font-size="10" fill="#4c1d95">"Action": "s3:GetObject"</text>
  <text x="102" y="333" font-family="Consolas, monospace" font-size="10" fill="#4c1d95">"Resource": "arn:aws:s3:::bucket/*"</text>

  <!-- Encryption note box -->
  <rect x="500" y="250" width="380" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="690" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">Per-Object Encryption</text>
  <text x="512" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#14532d">Bucket default: SSE-S3 (AES-256, AWS-owned key)</text>
  <text x="512" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#14532d">intro.sh v3 overridden to SSE-KMS (aws/s3 key)</text>
  <text x="512" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#14532d">Override created a NEW version, older versions unchanged</text>

  <!-- intro.sh versions box -->
  <rect x="90" y="360" width="380" height="110" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="280" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">Object: intro.sh (3 versions)</text>
  <text x="102" y="400" font-family="Consolas, monospace" font-size="10" fill="#7f1d1d">v1 — SSE-S3 (original)</text>
  <text x="102" y="416" font-family="Consolas, monospace" font-size="10" fill="#7f1d1d">v2 — SSE-S3 (overwrite test)</text>
  <text x="102" y="432" font-family="Consolas, monospace" font-size="10" fill="#7f1d1d">v3 — SSE-KMS (current, encryption override)</text>
  <text x="102" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#7f1d1d">Delete-marker rollback tested successfully</text>

  <!-- index.html static website box -->
  <rect x="500" y="360" width="380" height="110" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="690" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0c4a6e" text-anchor="middle">Object: index.html (Static Website)</text>
  <text x="512" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0c4a6e">Index document for Static Website Hosting</text>
  <text x="512" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0c4a6e">v2 uploaded live, confirmed on endpoint</text>
  <text x="512" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0c4a6e">v2 deleted &#8594; site rolled back to v1 instantly</text>
  <text x="512" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#0c4a6e">Zero downtime, no re-upload needed</text>

  <!-- Lifecycle rule box -->
  <rect x="90" y="484" width="790" height="86" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="485" y="503" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7c2d12" text-anchor="middle">Lifecycle Rule: demo-lifecycle-rule (applies to all objects)</text>
  <line x1="120" y1="540" x2="850" y2="540" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="140" cy="540" r="4" fill="#ea580c"/>
  <text x="140" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle">Day 0&#10;Standard</text>
  <circle cx="360" cy="540" r="4" fill="#ea580c"/>
  <text x="360" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle">Day 30 &#8594; Standard-IA</text>
  <circle cx="580" cy="540" r="4" fill="#ea580c"/>
  <text x="580" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle">Day 90 &#8594; Glacier Flexible Retrieval</text>
  <circle cx="800" cy="540" r="4" fill="#ea580c"/>
  <text x="800" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle">Day 365 &#8594; Expire</text>

  <!-- Bottom labels inside bucket -->
  <text x="80" y="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">Object URL (dot endpoint) &#8594; public GetObject via bucket policy</text>
  <text x="500" y="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">Website endpoint (dash endpoint) &#8594; serves index.html by default</text>
  <text x="80" y="616" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">Pre-signed URL &#8594; scoped, time-limited GetObject (5 min tested)</text>

  <!-- Arrows: Public user <-> bucket -->
  <line x1="190" y1="150" x2="190" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="205" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#2563eb">GetObject / website GET</text>

  <!-- Arrows: Authenticated user <-> bucket -->
  <line x1="810" y1="150" x2="810" y2="190" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="700" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#d97706">Pre-signed URL (5-min expiry)</text>

  <!-- Logging bucket -->
  <rect x="310" y="740" width="380" height="90" rx="10" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
  <text x="500" y="765" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">Logging Bucket (same region)</text>
  <text x="500" y="783" font-family="Consolas, monospace" font-size="10.5" fill="#1f2937" text-anchor="middle">menniboe-farm-s3-lab-logs</text>
  <text x="500" y="800" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">Target policy auto-updated by S3</text>
  <text x="500" y="816" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">Never points a bucket's logs at itself</text>

  <!-- Arrow: bucket -> logging bucket -->
  <line x1="500" y1="630" x2="500" y2="740" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="513" y="690" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4b5563">Server Access Logs</text>
</svg>
