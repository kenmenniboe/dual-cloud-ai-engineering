<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" font-family="Helvetica, Arial, sans-serif">

  <rect x="0" y="0" width="1000" height="860" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <text x="500" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#16191f">AWS Storage Hands-On — DataSync and S3 File Gateway</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#5f6b7a">Region: us-east-1  |  Default VPC 172.31.0.0/16</text>

  <!-- ============ LAB 1 ============ -->
  <rect x="30" y="85" width="940" height="250" rx="8" fill="#f7f9fb" stroke="#879196" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="50" y="110" font-size="15" font-weight="bold" fill="#16191f">LAB 1 — AWS DataSync: S3 to S3 (no agent)</text>
  <text x="50" y="129" font-size="12" fill="#5f6b7a">Both endpoints are inside AWS, so no DataSync agent is required</text>

  <!-- Source group -->
  <rect x="60" y="150" width="230" height="160" rx="6" fill="none" stroke="#7AA116" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="175" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a7a10">SOURCE</text>

  <rect x="95" y="186" width="160" height="56" rx="5" fill="#7AA116"/>
  <path d="M123 203 h22 v22 h-22 z M126 206 h16 v16 h-16 z" fill="#ffffff" opacity="0.95"/>
  <text x="185" y="210" font-size="12" font-weight="bold" fill="#ffffff">Amazon S3</text>
  <text x="185" y="226" font-size="10" fill="#eaf3d8">datasync-lab-src-*</text>

  <text x="175" y="262" text-anchor="middle" font-size="10" fill="#5f6b7a">claim-001.txt  claim-002.txt</text>
  <text x="175" y="277" text-anchor="middle" font-size="10" fill="#5f6b7a">archive/legacy.txt</text>
  <text x="175" y="295" text-anchor="middle" font-size="10" font-style="italic" fill="#879196">3 objects / 45 bytes</text>

  <!-- DataSync service -->
  <rect x="370" y="178" width="200" height="90" rx="6" fill="#E7157B"/>
  <path d="M407 205 l14 -10 v6 h16 v8 h-16 v6 z M437 222 l-14 10 v-6 h-16 v-8 h16 v-6 z" fill="#ffffff" opacity="0.95"/>
  <text x="480" y="208" font-size="13" font-weight="bold" fill="#ffffff">AWS DataSync</text>
  <text x="480" y="224" font-size="10" fill="#fbd6e8">Task: s3-to-s3-lab</text>
  <text x="480" y="239" font-size="10" fill="#fbd6e8">Verify: transferred files</text>
  <text x="470" y="288" text-anchor="middle" font-size="10" fill="#5f6b7a">Incremental: compares name, size, timestamp</text>
  <text x="470" y="303" text-anchor="middle" font-size="10" fill="#5f6b7a">2nd run transferred 0 files</text>

  <!-- Destination group -->
  <rect x="650" y="150" width="230" height="160" rx="6" fill="none" stroke="#7AA116" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="765" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a7a10">DESTINATION</text>

  <rect x="685" y="186" width="160" height="56" rx="5" fill="#7AA116"/>
  <path d="M713 203 h22 v22 h-22 z M716 206 h16 v16 h-16 z" fill="#ffffff" opacity="0.95"/>
  <text x="775" y="210" font-size="12" font-weight="bold" fill="#ffffff">Amazon S3</text>
  <text x="775" y="226" font-size="10" fill="#eaf3d8">datasync-lab-dst-*</text>

  <text x="765" y="262" text-anchor="middle" font-size="10" fill="#5f6b7a">Keys preserved exactly,</text>
  <text x="765" y="277" text-anchor="middle" font-size="10" fill="#5f6b7a">including archive/ prefix</text>

  <!-- Lab 1 arrows -->
  <line x1="258" y1="214" x2="365" y2="214" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="311" y="206" text-anchor="middle" font-size="10" fill="#4a5568">read</text>
  <line x1="573" y1="214" x2="681" y2="214" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="627" y="206" text-anchor="middle" font-size="10" fill="#4a5568">write</text>

  <!-- IAM role note -->
  <rect x="370" y="112" width="200" height="40" rx="5" fill="#ffffff" stroke="#DD344C" stroke-width="1.5"/>
  <text x="470" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#DD344C">IAM: DataSyncLabRole</text>
  <text x="470" y="143" text-anchor="middle" font-size="9" fill="#5f6b7a">trusts datasync.amazonaws.com</text>
  <line x1="470" y1="155" x2="470" y2="175" stroke="#DD344C" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- ============ LAB 2 ============ -->
  <rect x="30" y="360" width="940" height="430" rx="8" fill="#f7f9fb" stroke="#879196" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="50" y="385" font-size="15" font-weight="bold" fill="#16191f">LAB 2 — Amazon S3 File Gateway: NFS share backed by S3</text>
  <text x="50" y="404" font-size="12" fill="#5f6b7a">EC2 simulates the on-premises hypervisor that would normally host the gateway VM</text>

  <!-- Simulated on-prem group -->
  <rect x="60" y="425" width="400" height="245" rx="6" fill="none" stroke="#ED7100" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="260" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#b35900">SIMULATED ON-PREMISES (inside VPC)</text>

  <!-- NFS client -->
  <rect x="85" y="470" width="160" height="78" rx="5" fill="#ED7100"/>
  <rect x="108" y="492" width="26" height="18" rx="2" fill="#ffffff" opacity="0.95"/>
  <rect x="114" y="512" width="14" height="4" fill="#ffffff" opacity="0.95"/>
  <text x="185" y="494" font-size="12" font-weight="bold" fill="#ffffff">Amazon EC2</text>
  <text x="185" y="509" font-size="10" fill="#ffe3cc">nfs-client</text>
  <text x="185" y="523" font-size="10" fill="#ffe3cc">t3.micro / AL2023</text>
  <text x="165" y="540" text-anchor="middle" font-size="9" fill="#ffe3cc">mount: /mnt/sgw</text>

  <!-- Gateway appliance -->
  <rect x="275" y="470" width="160" height="78" rx="5" fill="#7AA116"/>
  <path d="M298 490 h20 v10 h-20 z M298 503 h20 v10 h-20 z M298 516 h20 v10 h-20 z" fill="#ffffff" opacity="0.95"/>
  <text x="375" y="494" font-size="12" font-weight="bold" fill="#ffffff">Storage Gateway</text>
  <text x="375" y="509" font-size="10" fill="#eaf3d8">sgw-lab (S3 File)</text>
  <text x="375" y="523" font-size="10" fill="#eaf3d8">m5.xlarge appliance</text>
  <text x="375" y="540" text-anchor="middle" font-size="9" fill="#eaf3d8">private IP 172.31.x.x</text>

  <!-- cache disk -->
  <rect x="275" y="575" width="160" height="48" rx="5" fill="#ffffff" stroke="#7AA116" stroke-width="1.5"/>
  <text x="355" y="594" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a7a10">EBS cache disk</text>
  <text x="355" y="610" text-anchor="middle" font-size="10" fill="#5f6b7a">/dev/sdb — 150 GiB min</text>
  <line x1="355" y1="551" x2="355" y2="572" stroke="#4a5568" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="260" y="648" text-anchor="middle" font-size="10" fill="#5f6b7a">Cache hit = local latency  |  Cache miss = fetched from S3 on demand</text>

  <!-- NFS arrow -->
  <line x1="248" y1="500" x2="271" y2="500" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="466" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a5568">NFS</text>
  <text x="259" y="520" text-anchor="middle" font-size="9" fill="#4a5568">2049</text>

  <!-- AWS cloud group -->
  <rect x="560" y="425" width="380" height="245" rx="6" fill="none" stroke="#7AA116" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="750" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a7a10">AWS CLOUD</text>

  <rect x="620" y="478" width="180" height="64" rx="5" fill="#7AA116"/>
  <path d="M650 497 h22 v22 h-22 z M653 500 h16 v16 h-16 z" fill="#ffffff" opacity="0.95"/>
  <text x="720" y="503" font-size="12" font-weight="bold" fill="#ffffff">Amazon S3</text>
  <text x="720" y="519" font-size="10" fill="#eaf3d8">sgw-lab-*  (Standard)</text>
  <text x="720" y="534" text-anchor="middle" font-size="9" fill="#eaf3d8">SSE-S3 encryption</text>

  <rect x="620" y="562" width="180" height="78" rx="5" fill="#ffffff" stroke="#879196" stroke-width="1.3"/>
  <text x="710" y="581" text-anchor="middle" font-size="11" font-weight="bold" fill="#16191f">Resulting objects</text>
  <text x="710" y="599" text-anchor="middle" font-size="10" fill="#5f6b7a">invoice-001.txt  (29 B)</text>
  <text x="710" y="615" text-anchor="middle" font-size="10" fill="#5f6b7a">reports/  (0 B folder object)</text>
  <text x="710" y="631" text-anchor="middle" font-size="10" fill="#5f6b7a">reports/q3.txt  (17 B)</text>
  <line x1="710" y1="545" x2="710" y2="559" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- HTTPS arrow -->
  <line x1="438" y1="500" x2="616" y2="500" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="527" y="492" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a5568">HTTPS (outbound)</text>
  <text x="527" y="516" text-anchor="middle" font-size="9" fill="#4a5568">file writes become S3 objects</text>

  <!-- IAM role for gateway -->
  <rect x="820" y="478" width="110" height="64" rx="5" fill="#ffffff" stroke="#DD344C" stroke-width="1.5"/>
  <text x="875" y="498" text-anchor="middle" font-size="10" font-weight="bold" fill="#DD344C">IAM role</text>
  <text x="875" y="513" text-anchor="middle" font-size="9" fill="#5f6b7a">StorageGateway</text>
  <text x="875" y="526" text-anchor="middle" font-size="9" fill="#5f6b7a">BucketAccessRole</text>
  <text x="875" y="538" text-anchor="middle" font-size="8" fill="#879196">auto-created</text>
  <line x1="816" y1="510" x2="804" y2="510" stroke="#DD344C" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

  <!-- Activation flow -->
  <rect x="60" y="690" width="880" height="80" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="80" y="711" font-size="12" font-weight="bold" fill="#6d28d9">ACTIVATION PATH (one time only)</text>

  <rect x="90" y="722" width="150" height="34" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="165" y="743" text-anchor="middle" font-size="11" fill="#16191f">Admin browser</text>

  <rect x="330" y="722" width="190" height="34" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="425" y="743" text-anchor="middle" font-size="11" fill="#16191f">Gateway public IP : 80</text>

  <rect x="620" y="722" width="230" height="34" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="735" y="743" text-anchor="middle" font-size="11" fill="#16191f">Storage Gateway service endpoint</text>

  <line x1="244" y1="739" x2="326" y2="739" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrowDash)"/>
  <text x="285" y="732" text-anchor="middle" font-size="9" fill="#6d28d9">fetch key</text>
  <line x1="524" y1="739" x2="616" y2="739" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrowDash)"/>
  <text x="570" y="732" text-anchor="middle" font-size="9" fill="#6d28d9">submit key</text>
  <text x="895" y="743" text-anchor="middle" font-size="9" fill="#6d28d9">close :80 after</text>

  <!-- Legend -->
  <text x="50" y="812" font-size="11" font-weight="bold" fill="#16191f">Legend</text>
  <rect x="110" y="802" width="14" height="14" rx="2" fill="#7AA116"/>
  <text x="130" y="813" font-size="10" fill="#5f6b7a">Storage</text>
  <rect x="190" y="802" width="14" height="14" rx="2" fill="#ED7100"/>
  <text x="210" y="813" font-size="10" fill="#5f6b7a">Compute</text>
  <rect x="280" y="802" width="14" height="14" rx="2" fill="#E7157B"/>
  <text x="300" y="813" font-size="10" fill="#5f6b7a">Migration &amp; Transfer</text>
  <rect x="425" y="802" width="14" height="14" rx="2" fill="#ffffff" stroke="#DD344C" stroke-width="1.5"/>
  <text x="445" y="813" font-size="10" fill="#5f6b7a">Security / IAM</text>
  <text x="540" y="813" font-size="10" fill="#5f6b7a">Dashed boxes group related resources — solid arrows carry data, dashed arrows carry trust or activation</text>

  <text x="500" y="843" text-anchor="middle" font-size="9" fill="#879196">All resources torn down after the session. Bucket names carry a timestamp suffix for global uniqueness.</text>

</svg>
