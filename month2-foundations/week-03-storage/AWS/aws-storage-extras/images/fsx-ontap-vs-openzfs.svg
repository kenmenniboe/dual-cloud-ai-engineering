<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>
  <defs>
    <marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#16191f">FSx for NetApp ONTAP vs FSx for OpenZFS</text>
  <text x="490" y="55" text-anchor="middle" font-size="12" fill="#5f6b7a">Both exist for lift-and-shift — moving a workload that already runs on that file system into AWS</text>

  <!-- ONTAP -->
  <rect x="25" y="78" width="455" height="310" rx="8" fill="#f7f9fb" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="252" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">FSx for NetApp ONTAP</text>

  <rect x="45" y="116" width="415" height="44" rx="5" fill="#8b5cf6"/>
  <text x="252" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">NFS  ·  SMB  ·  iSCSI</text>
  <text x="252" y="151" text-anchor="middle" font-size="9" fill="#e5dbff">the broadest protocol set of any FSx flavor</text>

  <text x="45" y="182" font-size="10" font-weight="bold" fill="#16191f">Client compatibility</text>
  <rect x="45" y="190" width="100" height="26" rx="3" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="95" y="207" text-anchor="middle" font-size="9" fill="#16191f">Linux</text>
  <rect x="152" y="190" width="100" height="26" rx="3" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="202" y="207" text-anchor="middle" font-size="9" fill="#16191f">Windows</text>
  <rect x="259" y="190" width="100" height="26" rx="3" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="309" y="207" text-anchor="middle" font-size="9" fill="#16191f">macOS</text>
  <rect x="366" y="190" width="94" height="26" rx="3" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="413" y="207" text-anchor="middle" font-size="9" fill="#16191f">VMware</text>

  <rect x="45" y="222" width="135" height="26" rx="3" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="112" y="239" text-anchor="middle" font-size="9" fill="#16191f">WorkSpaces</text>
  <rect x="187" y="222" width="130" height="26" rx="3" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="252" y="239" text-anchor="middle" font-size="9" fill="#16191f">AppStream</text>
  <rect x="324" y="222" width="136" height="26" rx="3" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="392" y="239" text-anchor="middle" font-size="9" fill="#16191f">EC2 · ECS · EKS</text>

  <rect x="45" y="262" width="415" height="38" rx="4" fill="#eef7e9" stroke="#7AA116" stroke-width="1.4"/>
  <text x="252" y="278" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a7a10">Storage automatically GROWS and SHRINKS</text>
  <text x="252" y="293" text-anchor="middle" font-size="9" fill="#5f6b7a">ONTAP-only signal</text>

  <rect x="45" y="308" width="415" height="38" rx="4" fill="#eef7e9" stroke="#7AA116" stroke-width="1.4"/>
  <text x="252" y="324" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a7a10">Compression AND deduplication</text>
  <text x="252" y="339" text-anchor="middle" font-size="9" fill="#5f6b7a">finds duplicate files — the cleanest separator</text>

  <text x="252" y="370" text-anchor="middle" font-size="9" fill="#5f6b7a">Snapshots · replication · point-in-time instantaneous cloning</text>

  <!-- OPENZFS -->
  <rect x="500" y="78" width="455" height="310" rx="8" fill="#f7f9fb" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="727" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">FSx for OpenZFS</text>

  <rect x="520" y="116" width="415" height="44" rx="5" fill="#8b5cf6"/>
  <text x="727" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">NFS only</text>
  <text x="727" y="151" text-anchor="middle" font-size="9" fill="#e5dbff">multiple NFS versions supported</text>

  <text x="520" y="182" font-size="10" font-weight="bold" fill="#16191f">Client compatibility</text>
  <rect x="520" y="190" width="135" height="26" rx="3" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="587" y="207" text-anchor="middle" font-size="9" fill="#16191f">Linux</text>
  <rect x="662" y="190" width="135" height="26" rx="3" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="729" y="207" text-anchor="middle" font-size="9" fill="#16191f">macOS</text>
  <rect x="804" y="190" width="131" height="26" rx="3" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="869" y="207" text-anchor="middle" font-size="9" fill="#16191f">Windows</text>

  <rect x="520" y="222" width="415" height="26" rx="3" fill="#ffffff" stroke="#879196" stroke-width="1.2"/>
  <text x="727" y="239" text-anchor="middle" font-size="9" font-style="italic" fill="#5f6b7a">broad, but reached over NFS rather than a native protocol per OS</text>

  <rect x="520" y="262" width="415" height="38" rx="4" fill="#eef7e9" stroke="#7AA116" stroke-width="1.4"/>
  <text x="727" y="278" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a7a10">Up to 1 million IOPS at under 0.5 ms</text>
  <text x="727" y="293" text-anchor="middle" font-size="9" fill="#5f6b7a">the raw-performance signal</text>

  <rect x="520" y="308" width="415" height="38" rx="4" fill="#fff5f5" stroke="#DD344C" stroke-width="1.4"/>
  <text x="727" y="324" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0263c">Compression — but NO deduplication</text>
  <text x="727" y="339" text-anchor="middle" font-size="9" fill="#5f6b7a">this is what separates it from ONTAP</text>

  <text x="727" y="370" text-anchor="middle" font-size="9" fill="#5f6b7a">Snapshots · point-in-time instantaneous cloning</text>

  <!-- SEPARATORS -->
  <rect x="25" y="404" width="930" height="100" rx="8" fill="#fff8e6" stroke="#f0b429" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="45" y="427" font-size="13" font-weight="bold" fill="#9a6700">TWO CLEAN SEPARATORS</text>

  <rect x="45" y="440" width="440" height="50" rx="4" fill="#ffffff" stroke="#f0b429" stroke-width="1.2"/>
  <text x="265" y="459" text-anchor="middle" font-size="10" font-weight="bold" fill="#16191f">1 · Deduplication</text>
  <text x="265" y="477" text-anchor="middle" font-size="9" fill="#5f6b7a">ONTAP has it. OpenZFS does not.</text>

  <rect x="500" y="440" width="435" height="50" rx="4" fill="#ffffff" stroke="#f0b429" stroke-width="1.2"/>
  <text x="717" y="459" text-anchor="middle" font-size="10" font-weight="bold" fill="#16191f">2 · Protocol breadth</text>
  <text x="717" y="477" text-anchor="middle" font-size="9" fill="#5f6b7a">Windows clients, macOS, or iSCSI in the question → ONTAP</text>
</svg>
