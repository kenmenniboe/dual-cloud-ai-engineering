<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DD344C"/>
    </marker>
  </defs>

  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#16191f">FSx for Windows File Server — SMB, NTFS and Active Directory</text>
  <text x="490" y="55" text-anchor="middle" font-size="12" fill="#5f6b7a">Every connection is authenticated against a domain controller before NTFS permissions are evaluated</text>

  <!-- CLIENTS -->
  <rect x="25" y="78" width="270" height="250" rx="8" fill="#f7f9fb" stroke="#ED7100" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="160" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#b35900">CLIENTS</text>

  <rect x="50" y="116" width="220" height="56" rx="5" fill="#ED7100"/>
  <text x="160" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Windows EC2</text>
  <text x="160" y="156" text-anchor="middle" font-size="9" fill="#ffe3cc">domain-joined, maps a drive</text>

  <rect x="50" y="184" width="220" height="56" rx="5" fill="#ED7100"/>
  <text x="160" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Linux EC2</text>
  <text x="160" y="224" text-anchor="middle" font-size="9" fill="#ffe3cc">mounts over SMB with cifs-utils</text>

  <rect x="50" y="252" width="220" height="58" rx="5" fill="#fff5f5" stroke="#DD344C" stroke-width="1.3"/>
  <text x="160" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0263c">EXAM TWIST</text>
  <text x="160" y="289" text-anchor="middle" font-size="9" fill="#5f6b7a">Linux CAN mount FSx for Windows.</text>
  <text x="160" y="302" text-anchor="middle" font-size="9" fill="#5f6b7a">Seeing &quot;Linux&quot; does not rule it out.</text>

  <!-- FSX -->
  <rect x="345" y="78" width="280" height="250" rx="8" fill="#f7f9fb" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="485" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">MANAGED FILE SYSTEM</text>

  <rect x="368" y="116" width="234" height="72" rx="5" fill="#8b5cf6"/>
  <text x="485" y="139" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">FSx for Windows File Server</text>
  <text x="485" y="157" text-anchor="middle" font-size="10" fill="#e5dbff">SMB protocol · NTFS filesystem</text>
  <text x="485" y="173" text-anchor="middle" font-size="10" fill="#e5dbff">NTFS ACLs · user quotas</text>

  <rect x="368" y="200" width="112" height="54" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="424" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">SSD</text>
  <text x="424" y="234" text-anchor="middle" font-size="8" fill="#5f6b7a">databases, media,</text>
  <text x="424" y="246" text-anchor="middle" font-size="8" fill="#5f6b7a">analytics</text>

  <rect x="490" y="200" width="112" height="54" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="546" y="219" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">HDD</text>
  <text x="546" y="234" text-anchor="middle" font-size="8" fill="#5f6b7a">home directories,</text>
  <text x="546" y="246" text-anchor="middle" font-size="8" fill="#5f6b7a">CMS</text>

  <rect x="368" y="266" width="234" height="46" rx="4" fill="#ffffff" stroke="#879196" stroke-width="1.2"/>
  <text x="485" y="284" text-anchor="middle" font-size="10" font-weight="bold" fill="#16191f">Multi-AZ configurable</text>
  <text x="485" y="301" text-anchor="middle" font-size="9" fill="#5f6b7a">daily backups to Amazon S3</text>

  <!-- IDENTITY -->
  <rect x="675" y="78" width="280" height="250" rx="8" fill="#f7f9fb" stroke="#DD344C" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="815" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0263c">IDENTITY</text>

  <rect x="698" y="116" width="234" height="64" rx="5" fill="#DD344C"/>
  <text x="815" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Active Directory</text>
  <text x="815" y="156" text-anchor="middle" font-size="9" fill="#fbd9de">authentication + authorization</text>
  <text x="815" y="170" text-anchor="middle" font-size="9" fill="#fbd9de">Kerberos tickets · Group Policy</text>

  <rect x="698" y="192" width="112" height="60" rx="4" fill="#ffffff" stroke="#DD344C" stroke-width="1.3"/>
  <text x="754" y="211" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0263c">Domain</text>
  <text x="754" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0263c">Controller 1</text>
  <text x="754" y="242" text-anchor="middle" font-size="8" fill="#5f6b7a">LDAP · DNS</text>

  <rect x="820" y="192" width="112" height="60" rx="4" fill="#ffffff" stroke="#DD344C" stroke-width="1.3"/>
  <text x="876" y="211" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0263c">Domain</text>
  <text x="876" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0263c">Controller 2</text>
  <text x="876" y="242" text-anchor="middle" font-size="8" fill="#5f6b7a">redundancy</text>

  <rect x="698" y="264" width="234" height="48" rx="4" fill="#fff8e6" stroke="#f0b429" stroke-width="1.2"/>
  <text x="815" y="282" text-anchor="middle" font-size="9" font-weight="bold" fill="#9a6700">If every DC is down, nobody authenticates.</text>
  <text x="815" y="298" text-anchor="middle" font-size="9" fill="#5f6b7a">DC reachability is a prerequisite, not an extra.</text>

  <!-- arrows -->
  <line x1="273" y1="144" x2="364" y2="144" stroke="#4a5568" stroke-width="2" marker-end="url(#fa)"/>
  <text x="318" y="136" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a5568">SMB 445</text>
  <line x1="273" y1="212" x2="364" y2="180" stroke="#4a5568" stroke-width="2" marker-end="url(#fa)"/>

  <line x1="605" y1="150" x2="694" y2="150" stroke="#DD344C" stroke-width="2" marker-end="url(#fb)"/>
  <text x="649" y="142" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0263c">verify user</text>
  <text x="649" y="166" text-anchor="middle" font-size="8" fill="#c0263c">resolve groups</text>

  <!-- HYBRID -->
  <rect x="25" y="350" width="930" height="130" rx="8" fill="#f7f9fb" stroke="#879196" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="45" y="373" font-size="13" font-weight="bold" fill="#16191f">HYBRID — joining an existing on-premises file server</text>

  <rect x="55" y="390" width="200" height="66" rx="5" fill="#ED7100"/>
  <text x="155" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">On-prem Windows</text>
  <text x="155" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">File Server</text>
  <text x="155" y="446" text-anchor="middle" font-size="9" fill="#ffe3cc">existing shares</text>

  <rect x="350" y="390" width="230" height="66" rx="5" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="465" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">DFS Namespaces</text>
  <text x="465" y="429" text-anchor="middle" font-size="9" fill="#5f6b7a">groups file systems under</text>
  <text x="465" y="442" text-anchor="middle" font-size="9" fill="#5f6b7a">one unified path</text>

  <rect x="675" y="390" width="230" height="66" rx="5" fill="#8b5cf6"/>
  <text x="790" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">FSx for Windows</text>
  <text x="790" y="431" text-anchor="middle" font-size="9" fill="#e5dbff">reachable over VPN or</text>
  <text x="790" y="444" text-anchor="middle" font-size="9" fill="#e5dbff">Direct Connect</text>

  <line x1="258" y1="423" x2="346" y2="423" stroke="#4a5568" stroke-width="2" marker-end="url(#fa)"/>
  <line x1="583" y1="423" x2="671" y2="423" stroke="#4a5568" stroke-width="2" marker-end="url(#fa)"/>

  <!-- footer -->
  <rect x="25" y="496" width="930" height="80" rx="8" fill="#f5f8fc" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="45" y="519" font-size="12" font-weight="bold" fill="#005a9e">AZURE ANCHOR</text>
  <text x="45" y="541" font-size="11" fill="#16191f">Azure Files + Azure AD Domain Services</text>
  <text x="45" y="562" font-size="10" font-style="italic" fill="#5f6b7a">Careful: Entra ID is cloud identity. Entra Domain Services provides the managed domain with Kerberos and LDAP that file shares actually need.</text>

  <text x="945" y="541" text-anchor="end" font-size="10" fill="#5f6b7a">Cheapest dev config: Single-AZ + HDD</text>
</svg>
