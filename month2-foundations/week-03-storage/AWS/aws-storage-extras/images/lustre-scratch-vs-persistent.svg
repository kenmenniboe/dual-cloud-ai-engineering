<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#16191f">FSx for Lustre — Scratch vs Persistent</text>
  <text x="490" y="55" text-anchor="middle" font-size="12" fill="#5f6b7a">Lustre = Linux + cluster. Both deployment types live in a SINGLE Availability Zone.</text>

  <!-- SCRATCH -->
  <rect x="25" y="78" width="455" height="250" rx="8" fill="#f7f9fb" stroke="#879196" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="45" y="101" font-size="14" font-weight="bold" fill="#16191f">SCRATCH</text>
  <text x="45" y="119" font-size="11" fill="#5f6b7a">Short-term processing · cost-optimized · 6x burst performance</text>

  <rect x="45" y="134" width="190" height="42" rx="5" fill="#ED7100"/>
  <text x="140" y="151" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">Compute in AZ-1</text>
  <text x="140" y="167" text-anchor="middle" font-size="9" fill="#ffe3cc">EC2 cluster nodes</text>

  <rect x="265" y="134" width="190" height="42" rx="5" fill="#ED7100"/>
  <text x="360" y="151" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">Compute in AZ-2</text>
  <text x="360" y="167" text-anchor="middle" font-size="9" fill="#ffe3cc">EC2 cluster nodes</text>

  <rect x="45" y="206" width="410" height="60" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="250" y="224" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">FSx for Lustre file system — ONE AZ</text>

  <rect x="165" y="230" width="170" height="28" rx="4" fill="#8b5cf6"/>
  <text x="250" y="249" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">Data — 1 copy only</text>

  <line x1="140" y1="179" x2="200" y2="202" stroke="#4a5568" stroke-width="1.8" marker-end="url(#la)"/>
  <line x1="360" y1="179" x2="300" y2="202" stroke="#4a5568" stroke-width="1.8" marker-end="url(#la)"/>

  <rect x="45" y="278" width="410" height="38" rx="4" fill="#fff5f5" stroke="#DD344C" stroke-width="1.3"/>
  <text x="250" y="302" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0263c">No replication — data is LOST if the underlying server fails</text>

  <!-- PERSISTENT -->
  <rect x="500" y="78" width="455" height="250" rx="8" fill="#f7f9fb" stroke="#879196" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="520" y="101" font-size="14" font-weight="bold" fill="#16191f">PERSISTENT</text>
  <text x="520" y="119" font-size="11" fill="#5f6b7a">Long-term storage of sensitive data · standard performance</text>

  <rect x="520" y="134" width="190" height="42" rx="5" fill="#ED7100"/>
  <text x="615" y="151" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">Compute in AZ-1</text>
  <text x="615" y="167" text-anchor="middle" font-size="9" fill="#ffe3cc">EC2 cluster nodes</text>

  <rect x="740" y="134" width="190" height="42" rx="5" fill="#ED7100"/>
  <text x="835" y="151" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">Compute in AZ-2</text>
  <text x="835" y="167" text-anchor="middle" font-size="9" fill="#ffe3cc">EC2 cluster nodes</text>

  <rect x="520" y="206" width="410" height="60" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="725" y="224" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">FSx for Lustre file system — STILL ONE AZ</text>

  <rect x="565" y="230" width="140" height="28" rx="4" fill="#8b5cf6"/>
  <text x="635" y="249" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">Data copy 1</text>

  <rect x="745" y="230" width="140" height="28" rx="4" fill="#8b5cf6"/>
  <text x="815" y="249" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">Data copy 2</text>

  <line x1="709" y1="244" x2="741" y2="244" stroke="#4a5568" stroke-width="1.8" marker-end="url(#la)"/>

  <line x1="615" y1="179" x2="650" y2="202" stroke="#4a5568" stroke-width="1.8" marker-end="url(#la)"/>
  <line x1="835" y1="179" x2="800" y2="202" stroke="#4a5568" stroke-width="1.8" marker-end="url(#la)"/>

  <rect x="520" y="278" width="410" height="38" rx="4" fill="#eef7e9" stroke="#7AA116" stroke-width="1.3"/>
  <text x="725" y="302" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a7a10">Replicated WITHIN the same AZ — self-heals within minutes</text>

  <!-- TRAP -->
  <rect x="25" y="344" width="930" height="56" rx="8" fill="#fff5f5" stroke="#DD344C" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="490" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0263c">TRAP — FSx for Lustre is ALWAYS single-AZ. There is no Multi-AZ option.</text>
  <text x="490" y="388" text-anchor="middle" font-size="10" fill="#5f6b7a">Compute nodes in several AZs can connect to it, which is what makes the diagram look multi-AZ. The file system itself is not. Need Multi-AZ file storage for Linux? That is EFS.</text>

  <!-- S3 REPOSITORY -->
  <rect x="25" y="416" width="930" height="130" rx="8" fill="#f7f9fb" stroke="#7AA116" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="45" y="439" font-size="13" font-weight="bold" fill="#5a7a10">S3 DATA REPOSITORY — read S3 as a file system</text>

  <rect x="80" y="456" width="180" height="60" rx="5" fill="#7AA116"/>
  <text x="170" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Amazon S3</text>
  <text x="170" y="497" text-anchor="middle" font-size="9" fill="#eaf3d8">training dataset</text>

  <rect x="400" y="456" width="180" height="60" rx="5" fill="#8b5cf6"/>
  <text x="490" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">FSx for Lustre</text>
  <text x="490" y="497" text-anchor="middle" font-size="9" fill="#e5dbff">POSIX file access</text>

  <rect x="720" y="456" width="180" height="60" rx="5" fill="#7AA116"/>
  <text x="810" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Amazon S3</text>
  <text x="810" y="497" text-anchor="middle" font-size="9" fill="#eaf3d8">computation results</text>

  <line x1="263" y1="478" x2="396" y2="478" stroke="#4a5568" stroke-width="2" marker-end="url(#la)"/>
  <text x="329" y="470" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a5568">lazy load in</text>
  <text x="329" y="500" text-anchor="middle" font-size="8" fill="#5f6b7a">contents pulled on first access</text>

  <line x1="583" y1="478" x2="716" y2="478" stroke="#4a5568" stroke-width="2" marker-end="url(#la)"/>
  <text x="649" y="470" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a5568">export out</text>

  <text x="945" y="536" text-anchor="end" font-size="10" font-style="italic" fill="#5f6b7a">Exam signal: HPC · machine learning · EDA · video processing · financial modeling · sub-millisecond latency</text>

  <!-- storage options -->
  <rect x="25" y="562" width="930" height="46" rx="6" fill="#f7f9fb" stroke="#879196" stroke-width="1.2"/>
  <text x="45" y="580" font-size="10" font-weight="bold" fill="#16191f">Storage options</text>
  <text x="45" y="597" font-size="10" fill="#5f6b7a">SSD — low latency, IOPS-intensive, small and random file operations  ·  HDD — throughput-intensive, large sequential operations (cheaper)</text>
</svg>
