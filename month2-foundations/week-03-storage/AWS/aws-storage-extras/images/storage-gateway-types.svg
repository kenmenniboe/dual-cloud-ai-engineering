<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="490" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#16191f">AWS Storage Gateway — three types</text>
  <text x="490" y="55" text-anchor="middle" font-size="12" fill="#5f6b7a">A virtual appliance in the data center translates file, block and tape protocols into S3 API calls</text>

  <!-- column headers -->
  <rect x="25" y="74" width="300" height="26" rx="4" fill="#ED7100"/>
  <text x="175" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ON-PREMISES</text>

  <rect x="340" y="74" width="280" height="26" rx="4" fill="#879196"/>
  <text x="480" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">STORAGE GATEWAY VM</text>

  <rect x="635" y="74" width="320" height="26" rx="4" fill="#7AA116"/>
  <text x="795" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">AWS CLOUD</text>

  <!-- ROW 1: S3 FILE GATEWAY -->
  <rect x="25" y="112" width="930" height="132" rx="8" fill="#f7f9fb" stroke="#879196" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="45" y="134" font-size="13" font-weight="bold" fill="#16191f">1 · S3 FILE GATEWAY — a live file share backed by S3</text>

  <rect x="45" y="148" width="260" height="56" rx="5" fill="#ED7100"/>
  <text x="175" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">User group file share</text>
  <text x="175" y="187" text-anchor="middle" font-size="9" fill="#ffe3cc">application servers, desktops</text>

  <rect x="355" y="148" width="250" height="56" rx="5" fill="#7AA116"/>
  <text x="480" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">S3 File Gateway</text>
  <text x="480" y="187" text-anchor="middle" font-size="9" fill="#eaf3d8">local cache of recently used data</text>

  <rect x="655" y="148" width="135" height="56" rx="5" fill="#7AA116"/>
  <text x="722" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Amazon S3</text>
  <text x="722" y="189" text-anchor="middle" font-size="8" fill="#eaf3d8">Standard / IA / Int-Tier</text>

  <rect x="812" y="148" width="123" height="56" rx="5" fill="#ffffff" stroke="#7AA116" stroke-width="1.4"/>
  <text x="873" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a7a10">S3 Glacier</text>
  <text x="873" y="189" text-anchor="middle" font-size="8" fill="#5f6b7a">lifecycle policy only</text>

  <line x1="308" y1="176" x2="351" y2="176" stroke="#4a5568" stroke-width="2" marker-end="url(#ga)"/>
  <text x="330" y="168" text-anchor="middle" font-size="8" font-weight="bold" fill="#4a5568">NFS / SMB</text>
  <line x1="608" y1="176" x2="651" y2="176" stroke="#4a5568" stroke-width="2" marker-end="url(#ga)"/>
  <text x="630" y="168" text-anchor="middle" font-size="8" font-weight="bold" fill="#4a5568">HTTPS</text>
  <line x1="793" y1="176" x2="808" y2="176" stroke="#4a5568" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#ga)"/>

  <text x="45" y="226" font-size="9" fill="#5f6b7a">IAM role per gateway for bucket access  ·  Active Directory integration when using SMB  ·  file in, object out</text>

  <!-- ROW 2: VOLUME GATEWAY -->
  <rect x="25" y="256" width="930" height="150" rx="8" fill="#f7f9fb" stroke="#879196" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="45" y="278" font-size="13" font-weight="bold" fill="#16191f">2 · VOLUME GATEWAY — block volumes backed by S3</text>

  <rect x="45" y="292" width="260" height="56" rx="5" fill="#ED7100"/>
  <text x="175" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Application servers</text>
  <text x="175" y="331" text-anchor="middle" font-size="9" fill="#ffe3cc">mount raw block volumes</text>

  <rect x="355" y="292" width="250" height="56" rx="5" fill="#7AA116"/>
  <text x="480" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Volume Gateway</text>
  <text x="480" y="331" text-anchor="middle" font-size="9" fill="#eaf3d8">cached or stored mode</text>

  <rect x="655" y="292" width="135" height="56" rx="5" fill="#7AA116"/>
  <text x="722" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Amazon S3</text>
  <text x="722" y="333" text-anchor="middle" font-size="8" fill="#eaf3d8">volume data</text>

  <rect x="812" y="292" width="123" height="56" rx="5" fill="#ffffff" stroke="#7AA116" stroke-width="1.4"/>
  <text x="873" y="317" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a7a10">EBS snapshots</text>
  <text x="873" y="333" text-anchor="middle" font-size="8" fill="#5f6b7a">restore on-prem or in AWS</text>

  <line x1="308" y1="320" x2="351" y2="320" stroke="#4a5568" stroke-width="2" marker-end="url(#ga)"/>
  <text x="330" y="312" text-anchor="middle" font-size="8" font-weight="bold" fill="#4a5568">iSCSI</text>
  <line x1="608" y1="320" x2="651" y2="320" stroke="#4a5568" stroke-width="2" marker-end="url(#ga)"/>
  <line x1="793" y1="320" x2="808" y2="320" stroke="#4a5568" stroke-width="2" marker-end="url(#ga)"/>

  <rect x="45" y="360" width="440" height="34" rx="4" fill="#ffffff" stroke="#879196" stroke-width="1.2"/>
  <text x="265" y="381" text-anchor="middle" font-size="9" fill="#16191f"><tspan font-weight="bold">Cached</tspan> — primary data in S3, hot cache on-premises</text>

  <rect x="500" y="360" width="435" height="34" rx="4" fill="#ffffff" stroke="#879196" stroke-width="1.2"/>
  <text x="717" y="381" text-anchor="middle" font-size="9" fill="#16191f"><tspan font-weight="bold">Stored</tspan> — entire dataset stays on-prem, scheduled async backup to S3</text>

  <!-- ROW 3: TAPE GATEWAY -->
  <rect x="25" y="418" width="930" height="132" rx="8" fill="#f7f9fb" stroke="#879196" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="45" y="440" font-size="13" font-weight="bold" fill="#16191f">3 · TAPE GATEWAY — replace a physical tape library</text>

  <rect x="45" y="454" width="260" height="56" rx="5" fill="#ED7100"/>
  <text x="175" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Backup server</text>
  <text x="175" y="493" text-anchor="middle" font-size="9" fill="#ffe3cc">existing tape-based software</text>

  <rect x="355" y="454" width="250" height="56" rx="5" fill="#7AA116"/>
  <text x="480" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Tape Gateway</text>
  <text x="480" y="493" text-anchor="middle" font-size="9" fill="#eaf3d8">Virtual Tape Library (VTL)</text>

  <rect x="655" y="454" width="135" height="56" rx="5" fill="#7AA116"/>
  <text x="722" y="479" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Amazon S3</text>
  <text x="722" y="495" text-anchor="middle" font-size="8" fill="#eaf3d8">virtual tapes</text>

  <rect x="812" y="454" width="123" height="56" rx="5" fill="#ffffff" stroke="#7AA116" stroke-width="1.4"/>
  <text x="873" y="476" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a7a10">Glacier /</text>
  <text x="873" y="491" text-anchor="middle" font-size="10" font-weight="bold" fill="#5a7a10">Deep Archive</text>
  <text x="873" y="504" text-anchor="middle" font-size="8" fill="#5f6b7a">tape archive</text>

  <line x1="308" y1="482" x2="351" y2="482" stroke="#4a5568" stroke-width="2" marker-end="url(#ga)"/>
  <text x="330" y="474" text-anchor="middle" font-size="8" font-weight="bold" fill="#4a5568">iSCSI VTL</text>
  <line x1="608" y1="482" x2="651" y2="482" stroke="#4a5568" stroke-width="2" marker-end="url(#ga)"/>
  <line x1="793" y1="482" x2="808" y2="482" stroke="#4a5568" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#ga)"/>

  <text x="45" y="532" font-size="9" fill="#5f6b7a">The backup software keeps working unchanged — it still thinks it is writing to tape</text>

  <!-- footer -->
  <rect x="25" y="562" width="930" height="46" rx="6" fill="#fff5f5" stroke="#DD344C" stroke-width="1.3"/>
  <text x="45" y="580" font-size="10" font-weight="bold" fill="#c0263c">Protocol determines the type</text>
  <text x="45" y="597" font-size="10" fill="#5f6b7a">NFS or SMB (file-level) → S3 File Gateway  ·  iSCSI (raw blocks, client formats them) → Volume Gateway  ·  iSCSI VTL → Tape Gateway  ·  FSx File Gateway is closed to new customers</text>
</svg>
