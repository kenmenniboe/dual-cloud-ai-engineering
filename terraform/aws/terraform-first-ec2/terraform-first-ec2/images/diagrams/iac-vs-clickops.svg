<svg xmlns='http://www.w3.org/2000/svg' width='680' height='395' viewBox='0 0 680 395' font-family='Helvetica, Arial, sans-serif'><title>Manual build versus Infrastructure as Code</title><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M1 1L9 5L1 9z' fill='#232F3E'/></marker></defs><rect width='680' height='395' fill='#FFFFFF'/><rect x='30' y='40' width='290' height='300' rx='8' fill='none' stroke='#879196' stroke-width='1.2' stroke-dasharray='6 4'/><text x='44' y='62' font-size='14' font-weight='bold' fill='#232F3E'>Manual build (ClickOps)</text><rect x='360' y='40' width='290' height='300' rx='8' fill='none' stroke='#879196' stroke-width='1.2' stroke-dasharray='6 4'/><text x='374' y='62' font-size='14' font-weight='bold' fill='#232F3E'>Infrastructure as Code</text><rect x='60' y='80' width='230' height='56' rx='6' fill='#F2F3F3' stroke='#545B64' stroke-width='1.5'/><rect x='60' y='80' width='8' height='56' rx='2' fill='#545B64'/><text x='179.0' y='103' font-size='14' font-weight='bold' fill='#232F3E' text-anchor='middle'>Engineer</text><text x='179.0' y='122' font-size='12' fill='#232F3E' text-anchor='middle'>Clicks every setting</text><rect x='60' y='170' width='230' height='56' rx='6' fill='#F2F3F3' stroke='#545B64' stroke-width='1.5'/><rect x='60' y='170' width='8' height='56' rx='2' fill='#545B64'/><text x='179.0' y='193' font-size='14' font-weight='bold' fill='#232F3E' text-anchor='middle'>AWS Console</text><text x='179.0' y='212' font-size='12' fill='#232F3E' text-anchor='middle'>Steps live in memory</text><rect x='60' y='260' width='230' height='56' rx='6' fill='#FDF0E1' stroke='#ED7100' stroke-width='1.5'/><rect x='60' y='260' width='8' height='56' rx='2' fill='#ED7100'/><text x='179.0' y='283' font-size='14' font-weight='bold' fill='#7A3A00' text-anchor='middle'>EC2 instance</text><text x='179.0' y='302' font-size='12' fill='#7A3A00' text-anchor='middle'>Hard to repeat exactly</text><path d='M175 136 L175 166' fill='none' stroke='#232F3E' stroke-width='1.4' marker-end='url(#a)'/><text x='185' y='156' font-size='12' fill='#232F3E' text-anchor='start'>clicks</text><path d='M175 226 L175 256' fill='none' stroke='#232F3E' stroke-width='1.4' marker-end='url(#a)'/><text x='185' y='246' font-size='12' fill='#232F3E' text-anchor='start'>builds one</text><rect x='390' y='80' width='230' height='56' rx='6' fill='#F2F3F3' stroke='#545B64' stroke-width='1.5'/><rect x='390' y='80' width='8' height='56' rx='2' fill='#545B64'/><text x='509.0' y='103' font-size='14' font-weight='bold' fill='#232F3E' text-anchor='middle'>main.tf in Git</text><text x='509.0' y='122' font-size='12' fill='#232F3E' text-anchor='middle'>Versioned and reviewed</text><rect x='390' y='170' width='230' height='56' rx='6' fill='#F1EAFB' stroke='#7B42BC' stroke-width='1.5'/><rect x='390' y='170' width='8' height='56' rx='2' fill='#7B42BC'/><text x='509.0' y='193' font-size='14' font-weight='bold' fill='#3F1F6B' text-anchor='middle'>Terraform</text><text x='509.0' y='212' font-size='12' fill='#3F1F6B' text-anchor='middle'>Reads code, calls APIs</text><rect x='390' y='260' width='105' height='56' rx='6' fill='#FDF0E1' stroke='#ED7100' stroke-width='1.5'/><rect x='390' y='260' width='8' height='56' rx='2' fill='#ED7100'/><text x='446.5' y='283' font-size='14' font-weight='bold' fill='#7A3A00' text-anchor='middle'>Dev EC2</text><text x='446.5' y='302' font-size='12' fill='#7A3A00' text-anchor='middle'>Same code</text><rect x='515' y='260' width='105' height='56' rx='6' fill='#FDF0E1' stroke='#ED7100' stroke-width='1.5'/><rect x='515' y='260' width='8' height='56' rx='2' fill='#ED7100'/><text x='571.5' y='283' font-size='14' font-weight='bold' fill='#7A3A00' text-anchor='middle'>Prod EC2</text><text x='571.5' y='302' font-size='12' fill='#7A3A00' text-anchor='middle'>Same code</text><path d='M505 136 L505 166' fill='none' stroke='#232F3E' stroke-width='1.4' marker-end='url(#a)'/><text x='515' y='156' font-size='12' fill='#232F3E' text-anchor='start'>read by</text><path d='M480 226 L480 242 L442 242 L442 256' fill='none' stroke='#232F3E' stroke-width='1.4' marker-end='url(#a)'/><path d='M530 226 L530 242 L567 242 L567 256' fill='none' stroke='#232F3E' stroke-width='1.4' marker-end='url(#a)'/><rect x='60' y='362' width='12' height='12' fill='#F1EAFB' stroke='#7B42BC'/><text x='78' y='373' font-size='12' fill='#232F3E'>Terraform</text><rect x='153' y='362' width='12' height='12' fill='#FDF0E1' stroke='#ED7100'/><text x='171' y='373' font-size='12' fill='#232F3E'>Compute</text><rect x='232' y='362' width='12' height='12' fill='#F2F3F3' stroke='#545B64'/><text x='250' y='373' font-size='12' fill='#232F3E'>People, tools, files</text></svg>